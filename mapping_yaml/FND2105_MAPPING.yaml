    \            FROM\n                DWP01A_ACC_ORR.dw_stock_transfer_ln_fv AS TSP\n\
    \            WHERE\n                /* Accumated sum of the week */\n        \
    \        CAST(TSP.transfer_dt AS DATE) BETWEEN date '${WEEK_START_DT}'AND date\
