- description: Delete and Insert from trans table x
  file_name: FND2130.300.TARGET.sql
  file_present: true
  job_name: FND2130
  notes: 'SCOPE: Business_Date=${RUNDATE} , Update previous day in week flag to N '
  post_sql: ''
  pre_sql: ''
  reverse_sequence_no: 2
  sequence_no: 2
  source_database: ''
  source_table: ''
  sql_statement: "-- =================================================================================================\n\
    -- Populates the daily aggregated stock fact table by joining the pivoted staging\
    \ table\n-- with the two source fact staging tables.\n--\n-- Business Logic:\n\
    -- 1. Uses FND_STK_FCT_PVT_STG as the driver to ensure all combinations of\n--\
    \    business_date, loc_wid, and item_wid are included.\n-- 2. LEFT JOINs to FND_STK_FCT_01_FCT_STG\
    \ and FND_STK_FCT_02_FCT_STG to retrieve\n--    the actual stock measures.\n--\
    \ 3. COALESCE is used on all measure columns to convert NULLs to 0, which can\
    \ occur\n--    if a record does not exist in one of the source tables.\n-- 4.\
    \ Default values are provided for target columns that do not have a direct source.\n\
    -- 5. The script is designed to be re-runnable by deleting the data for the target\n\
    --    business date before insertion.\n-- =================================================================================================\n\
    -- Start a new transaction. This ensures that all subsequent operations are treated\
    \ as a single\n-- atomic unit of work. If any step fails, the entire transaction\
    \ can be rolled back.\nBEGIN TRANSACTION;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n\
    -- Lock the target table in WRITE mode to prevent other processes from modifying\
    \ it during the load.\n-- This ensures data consistency.\nLOCKING TABLE DW${INSTANCE}V_ACC_FND.DW_FND_AGG_DAILY_STOCK_FCT\
    \ FOR WRITE;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Before inserting new data,\
    \ delete any existing records for the entire business week\n-- This makes the\
    \ script re-runnable without creating duplicate data.\n-- Note: It deletes data\
    \ for the previous day, assuming this script runs for the current day's data.\n\
    DELETE FROM DW${INSTANCE}V_ACC_FND.DW_FND_AGG_DAILY_STOCK_FCT\nWHERE\n    business_date\
    \ BETWEEN date '${WEEK_START_DT}' AND date '${WEEK_END_DT}'\n;\n.IF ERRORCODE\
    \ <> 0 THEN .QUIT 101;\n-- Insert the aggregated data into the final fact table.\n\
    INSERT INTO DW${INSTANCE}V_ACC_FND.DW_FND_AGG_DAILY_STOCK_FCT (\n    business_date,\n\
    \    loc_wid,\n    item_wid,\n    location_soh_units,\n    depot_soh_units,\n\
    \    location_pack_units,\n    depot_pack_units,\n    location_retail_amount,\n\
    \    depot_retail_amount,\n    unit_cost_amount,\n    unit_retail_amount,\n  \
    \  on_order_units,\n    on_order_cost_amount,\n    on_order_retail_amount,\n \
    \   on_order_pack_units,\n    return_to_vendor_cost_amount,\n    return_to_vendor_retail_amount,\n\
    \    return_to_vendor_units,\n    return_to_vendor_pack_units,\n    transfer_expected_retail_amount,\n\
    \    transfer_expected_pack_units,\n    transfer_expected_cost_amount,\n    transfer_expected_units,\n\
    \    transfer_reserved_retail_amount,\n    transfer_reserved_pack_units,\n   \
    \ transfer_reserved_cost_amount,\n    transfer_reserved_units,\n    in_transit_retail_amount,\n\
    \    in_transit_pack_units,\n    in_transit_units,\n    in_transit_cost_amount,\n\
    \    non_sellable_retail_amount,\n    non_sellable_pack_units,\n    non_sellable_cost_amount,\n\
    \    non_sellable_units,\n    stock_count_units,\n    stock_count_snapshot_units,\n\
    \    stock_count_retail_amt,\n    stock_count_snapshot_retail_amt,\n    total_stock_loss_units,\n\
    \    total_stock_loss_value,\n    damaged_adjustment_units,\n    damaged_adjustment_amount,\n\
    \    soiled_adjustment_units,\n    soiled_adjustment_amount,\n    auto_adjustment_units,\n\
    \    auto_adjustment_amount,\n    other_adjustment_units,\n    other_adjustment_amount,\n\
    \    psr_blocked_units,\n    psr_retail_amount,\n    psr_blocked_pack_units,\n\
    \    psr_blocked_cost_amount,\n    trasfer_ship_units,\n    trasfer_ship_retail_amount,\n\
    \    trasfer_ship_cost_amount,\n    stock_cnt_adj_units,\n    stock_cnt_adj_retail_value,\n\
    \    soh_age_in_weeks,\n    transfer_outst_units,\n    transfer_outst_retail_value,\n\
    \    transfer_act_repo_cost_value,\n    transfer_act_upchrg_cost_value,\n    transfer_act_upchrg_unit_cost,\n\
    \    nlp_stock_value,\n    nlp_stock_units,\n    ras_units,\n    listed_stock,\n\
    \    carryover_units,\n    carryover_value,\n    price_action_week,\n    price_status,\n\
    \    transfer_outst_cost_value,\n    tsf_intake_qty,\n    tsf_intake_retail_amount,\n\
    \    tsf_intake_cost_amount,\n    ras_stock_value,\n    stock_unit_av_cost_amount,\n\
    \    lcp_intake,\n    lcp_gross,\n    wkly_flg,\n    listing_flg,\n    eff_from_dt,\n\
    \    eff_to_dt,\n    del_ind,\n    run_id,\n    update_run_id,\n    job_id,\n\
    \    update_job_id\n)\nSELECT\n    -- Key columns from the pivot table, which\
    \ acts as the driver for the join.\n    pvt.business_date AS business_date,\n\
    \    pvt.loc_wid AS loc_wid,\n    pvt.item_wid AS item_wid,\n    -- Measures from\
    \ the first source table (FCT1). COALESCE ensures no nulls are inserted.\n   \
    \ COALESCE(fct1.location_soh_units, 0) AS location_soh_units,\n    COALESCE(fct1.depot_soh_units,\
    \ 0) AS depot_soh_units,\n    COALESCE(fct1.location_pack_units, 0) AS location_pack_units,\n\
    \    COALESCE(fct1.depot_pack_units, 0) AS depot_pack_units,\n    COALESCE(fct1.location_retail_amount,\
    \ 0) AS location_retail_amount,\n    COALESCE(fct1.depot_retail_amount, 0) AS\
    \ depot_retail_amount,\n    COALESCE(fct1.unit_cost_amount, 0) AS unit_cost_amount,\n\
    \    COALESCE(fct1.unit_retail_amount, 0) AS unit_retail_amount,\n    COALESCE(fct1.on_order_units,\
    \ 0) AS on_order_units,\n    COALESCE(fct1.on_order_cost_amount, 0) AS on_order_cost_amount,\n\
    \    COALESCE(fct1.on_order_retail_amount, 0) AS on_order_retail_amount,\n   \
    \ COALESCE(fct1.on_order_pack_units, 0) AS on_order_pack_units,\n    COALESCE(fct1.return_to_vendor_cost_amount,\
    \ 0) AS return_to_vendor_cost_amount,\n    COALESCE(fct1.return_to_vendor_retail_amount,\
    \ 0) AS return_to_vendor_retail_amount,\n    COALESCE(fct1.return_to_vendor_units,\
    \ 0) AS return_to_vendor_units,\n    COALESCE(fct1.return_to_vendor_pack_units,\
    \ 0) AS return_to_vendor_pack_units,\n    COALESCE(fct1.transfer_expected_retail_amount,\
    \ 0) AS transfer_expected_retail_amount,\n    COALESCE(fct1.transfer_expected_pack_units,\
    \ 0) AS transfer_expected_pack_units,\n    COALESCE(fct1.transfer_expected_cost_amount,\
    \ 0) AS transfer_expected_cost_amount,\n    COALESCE(fct1.transfer_expected_units,\
    \ 0) AS transfer_expected_units,\n    COALESCE(fct1.transfer_reserved_retail_amount,\
    \ 0) AS transfer_reserved_retail_amount,\n    COALESCE(fct1.transfer_reserved_pack_units,\
    \ 0) AS transfer_reserved_pack_units,\n    COALESCE(fct1.transfer_reserved_cost_amount,\
    \ 0) AS transfer_reserved_cost_amount,\n    COALESCE(fct1.transfer_reserved_units,\
    \ 0) AS transfer_reserved_units,\n    COALESCE(fct1.in_transit_retail_amount,\
    \ 0) AS in_transit_retail_amount,\n    COALESCE(fct1.in_transit_pack_units, 0)\
    \ AS in_transit_pack_units,\n    COALESCE(fct1.in_transit_units, 0) AS in_transit_units,\n\
    \    COALESCE(fct1.in_transit_cost_amount, 0) AS in_transit_cost_amount,\n   \
    \ COALESCE(fct1.non_sellable_retail_amount, 0) AS non_sellable_retail_amount,\n\
    \    COALESCE(fct1.non_sellable_pack_units, 0) AS non_sellable_pack_units,\n \
    \   COALESCE(fct1.non_sellable_cost_amount, 0) AS non_sellable_cost_amount,\n\
    \    COALESCE(fct1.non_sellable_units, 0) AS non_sellable_units,\n    -- Measures\
    \ from the second source table (FCT2).\n    COALESCE(fct2.stock_count_units, 0)\
    \ AS stock_count_units,\n    COALESCE(fct2.stock_count_snapshot_units, 0) AS stock_count_snapshot_units,\n\
    \    COALESCE(fct2.stock_count_retail_amt, 0) AS stock_count_retail_amt,\n   \
    \ COALESCE(fct2.stock_count_snapshot_retail_amt, 0) AS stock_count_snapshot_retail_amt,\n\
    \    COALESCE(fct2.total_stock_loss_units, 0) AS total_stock_loss_units,\n   \
    \ COALESCE(fct2.total_stock_loss_value, 0) AS total_stock_loss_value,\n    --\
    \ Adjustment measures from FCT1.\n    COALESCE(fct1.damaged_adjustment_units,\
    \ 0) AS damaged_adjustment_units,\n    COALESCE(fct1.damaged_adjustment_amount,\
    \ 0) AS damaged_adjustment_amount,\n    COALESCE(fct1.soiled_adjustment_units,\
    \ 0) AS soiled_adjustment_units,\n    COALESCE(fct1.soiled_adjustment_amount,\
    \ 0) AS soiled_adjustment_amount,\n    COALESCE(fct1.auto_adjustment_units, 0)\
    \ AS auto_adjustment_units,\n    COALESCE(fct1.auto_adjustment_amount, 0) AS auto_adjustment_amount,\n\
    \    COALESCE(fct1.other_adjustment_units, 0) AS other_adjustment_units,\n   \
    \ COALESCE(fct1.other_adjustment_amount, 0) AS other_adjustment_amount,\n    --\
    \ PSR (Potentially Slow-moving/Redundant) measures from FCT1.\n    COALESCE(fct1.psr_blocked_units,\
    \ 0) AS psr_blocked_units,\n    COALESCE(fct1.psr_retail_amount, 0) AS psr_retail_amount,\n\
    \    COALESCE(fct1.psr_blocked_pack_units, 0) AS psr_blocked_pack_units,\n   \
    \ COALESCE(fct1.psr_blocked_cost_amount, 0) AS psr_blocked_cost_amount,\n    --\
    \ Transfer ship measures from FCT2.\n    COALESCE(fct2.trasfer_ship_units, 0)\
    \ AS trasfer_ship_units,\n    COALESCE(fct2.trasfer_ship_retail_amount, 0) AS\
    \ trasfer_ship_retail_amount,\n    COALESCE(fct2.trasfer_ship_cost_amount, 0)\
    \ AS trasfer_ship_cost_amount,\n    -- Stock count adjustment measures from FCT1.\n\
    \    COALESCE(fct1.stock_cnt_adj_units, 0) AS stock_cnt_adj_units,\n    COALESCE(fct1.stock_cnt_adj_retail_value,\
    \ 0) AS stock_cnt_adj_retail_value,\n    -- Defaulted and other measures where\
    \ a direct source is not available or logic is applied.\n    0 AS soh_age_in_weeks,\
    \ -- No source column, defaulting to 0.\n    COALESCE(fct2.transfer_outst_units,\
    \ 0) AS transfer_outst_units,\n    COALESCE(fct2.transfer_outst_retail_value,\
    \ 0) AS transfer_outst_retail_value,\n    COALESCE(fct2.transfer_act_repo_cost_value,\
    \ 0) AS transfer_act_repo_cost_value,\n    COALESCE(fct2.transfer_act_upchrg_cost_value,\
    \ 0) AS transfer_act_upchrg_cost_value,\n    COALESCE(fct2.transfer_act_upchrg_unit_cost,\
    \ 0) AS transfer_act_upchrg_unit_cost,\n    COALESCE(fct1.nlp_stock_value, 0)\
    \ AS nlp_stock_value,\n    COALESCE(fct1.nlp_stock_units, 0) AS nlp_stock_units,\n\
    \    COALESCE(fct1.ras_units, 0) AS ras_units,\n    COALESCE(fct1.listed_stock,\
    \ 0) AS listed_stock,\n    COALESCE(fct1.carryover_units, 0) AS carryover_units,\n\
    \    COALESCE(fct1.carryover_value, 0) AS carryover_value,\n    COALESCE(fct1.price_action_week,\
    \ 0) AS price_action_week,\n    COALESCE(fct1.price_status, 'N') AS price_status,\n\
    \    COALESCE(fct2.transfer_outst_cost_value, 0) AS transfer_outst_cost_value,\n\
    \    COALESCE(fct2.tsf_intake_qty, 0) AS tsf_intake_qty,\n    COALESCE(fct2.tsf_intake_retail_amount,\
    \ 0) AS tsf_intake_retail_amount,\n    COALESCE(fct2.tsf_intake_cost_amount, 0)\
    \ AS tsf_intake_cost_amount,\n    COALESCE(fct1.ras_stock_value, 0) AS ras_stock_value,\n\
    \    COALESCE(fct1.stock_unit_av_cost_amount, 0) AS stock_unit_av_cost_amount,\n\
    \    COALESCE(fct3.lcp_intake, 0) AS lcp_intake,\n    COALESCE(fct3.lcp_gross,\
    \ 0) AS lcp_gross,\n    'Y' AS wkly_flg, -- Defaulting to 'Y', assuming the daily\
    \ load is the weekly snapshot.\n    COALESCE(fct1.listing_flg, 'N') AS listing_flg,\n\
    \    -- Audit and metadata columns for tracking and versioning.\n  date '${EFF_FROM_DT}'\
    \  AS eff_from_dt, -- Effective from the date of the run.\n    DATE '3500-12-31'\
    \ AS eff_to_dt, -- A high date represents the current version.\n    0 AS del_ind,\
    \ -- Deletion indicator, 0 means the record is active.\n    ${RUNID} AS run_id,\
    \ -- Populated from a script variable.\n    NULL AS update_run_id, -- NULL for\
    \ new records.\n    '${JOB}' AS job_id, -- Populated from a script variable.\n\
    \    NULL AS update_job_id -- NULL for new records.\nFROM\n    DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_PVT_STG\
    \ AS pvt\nLEFT OUTER JOIN\n    DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_01_FCT_STG\
    \ AS fct1\n        ON pvt.business_date = fct1.business_date\n        AND pvt.loc_wid\
    \ = fct1.loc_wid\n        AND pvt.item_wid = fct1.item_wid\nLEFT OUTER JOIN\n\
