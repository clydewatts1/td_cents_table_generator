mapping_columns_count: 62
mapping_sheet_name: MAPPING
pattern: Staging
primary_key:
- business_date
- loc_wid
- item_wid
sql_steps:
  FND2102.300.TARGET: "WITH\n    /* Stop Sell CTE  */\n    STPSEL AS (\n        SELECT\
    \ DISTINCT\n            item_wid,\n            loc_wid,\n            pmk_stop_sell\n\
    \        FROM DW${INSTANCE}A_IDW.PMK_LOC_ITEM AS PLI\n        WHERE\n        \
    \    cur_flg = 'Y'\n            AND pmk_stop_sell = 'Y'\n            AND ssor_id\
    \ = 4\n            AND level_cd = 'PSR_BLK'\n    ),\n    /* Soiled and Damaged\
    \ Adjustments */\n    /* This is a running weekly total */\n    INV_VOL AS (\n\
    \        SELECT\n            invtry_tsactn_id,\n            invtry_tsactn_wid,\n\
    \            loc_id,\n            loc_wid,\n            invtry_rsn_cd,\n     \
    \       pmk_tsactn_comts_txt,\n            eff_from_dttm,\n            eff_to_dttm,\n\
    \            cur_flg,\n            del_flg,\n            ssor_id,\n          \
    \  tsactn_type_cd\n        FROM DW${INSTANCE}A_IDW.INVTRY_TSACTN AS INV\n    \
    \    WHERE\n            (\n                TRUNC(INV.eff_from_dttm) BETWEEN DATE\
    \ '${LDTK_DATE}' AND DATE '${LDTK_DATE}' + 1\n                OR TRUNC(INV.eff_to_dttm)\
    \ BETWEEN DATE '${LDTK_DATE}' AND '${LDTK_DATE}' + 1\n            )\n        \
    \    AND INV.cur_flg = 'Y'\n            AND INV.ssor_id <> 3\n            AND\
    \ INV.tsactn_type_cd = 'STA'\n    ),\n    STK_ADJS_TY AS (\n        SELECT DISTINCT\
    \ -- Same as group by\n            I.invtry_tsactn_id AS stock_adjustment_id,\n\
    \            I.loc_id AS location_id,\n            I.loc_wid,\n            I.invtry_rsn_cd\
    \ AS stock_adjustment_reason_cd,\n            I.pmk_tsactn_comts_txt AS stock_adjustment_comment,\n\
    \            ITM.item_id AS item_id,\n            ITM.item_wid,\n            ITM.cmpltn_dttm\
    \ AS stock_adjustment_date,\n            ITM.item_adjst_qty AS stock_adjustment_units,\n\
    \            I.eff_from_dttm AS effective_from_dt,\n            I.eff_to_dttm\
    \ AS effective_to_dt,\n            CASE WHEN I.cur_flg || ITM.cur_flg = 'YY' THEN\
    \ 'Y' ELSE 'N' END AS current_flg,\n            I.del_flg AS delete_flg,\n   \
    \         I.ssor_id AS src_system_id\n        FROM INV_VOL AS I\n        INNER\
    \ JOIN DW${INSTANCE}A_IDW.INVTRY_TSACTN_ITEM AS ITM\n            ON I.invtry_tsactn_wid\
    \ = ITM.invtry_tsactn_wid\n                AND I.invtry_tsactn_id = ITM.invtry_tsactn_id\n\
    \                AND I.tsactn_type_cd = 'STA'\n                AND ITM.ssor_id\
    \ <> 3\n        WHERE\n            I.ssor_id <> 3\n    ),\n    STK_ADJ AS (\n\
    \        SELECT\n            loc_wid,\n            item_wid,\n            /* Always\
    \ use \"RUNDATE\" */\n            DATE '${LDTK_DATE}' AS business_date,\n    \
    \        CASE\n                WHEN stock_adjustment_reason_cd IN (110, 522, 82,\
    \ 560, 81, 707)\n                    THEN stock_adjustment_units\n           \
    \ END AS damaged_adjustment_units,\n            CASE\n                WHEN stock_adjustment_reason_cd\
    \ IN (703, 704, 714, 724, 725)\n                    THEN stock_adjustment_units\n\
    \            END AS soiled_adjustment_units,\n            CASE\n             \
    \   WHEN stock_adjustment_reason_cd IN (721, 720)\n                    THEN stock_adjustment_units\n\
    \            END AS auto_adjustment_units,\n            CASE\n               \
    \ WHEN stock_adjustment_reason_cd IN (141)\n                    THEN stock_adjustment_units\n\
    \            END AS stock_count_adjustment_units,\n            CASE\n        \
    \        WHEN stock_adjustment_reason_cd IS NULL\n                    THEN 0.0000\n\
    \                WHEN stock_adjustment_reason_cd NOT IN (110, 522, 82, 560, 81,\
    \ 714, 721, 720, 707, 703, 704, 724, 725)\n                    THEN stock_adjustment_units\n\
    \            END AS other_adjustment_units\n        FROM STK_ADJS_TY AS STK_ADJS_TY\
    \ --RFC 17880/CHG0031571- CAST AS DATE APPLIED\n        WHERE\n            current_flg\
    \ = 'Y'\n            /* Get a accrued adjustment total for the week , so the date\
    \ range will be from sunday - start of week\n               to end of week */\n\
    \            /* Use RUNDATE AS date '2025-08-07' */\n            AND CAST(STK_ADJS_TY.stock_adjustment_date\
    \ AS DATE) BETWEEN TD_SUNDAY(DATE '${LDTK_DATE}') AND TD_SUNDAY(DATE '${LDTK_DATE}')\
    \ + 6\n    ),\n    STADJ AS (\n        SELECT\n            STK_ADJ.loc_wid,\n\
    \            STK_ADJ.item_wid,\n            STK_ADJ.business_date,\n         \
    \   CAST(SUM(STK_ADJ.damaged_adjustment_units) AS INTEGER) AS damaged_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.soiled_adjustment_units) AS INTEGER) AS soiled_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.auto_adjustment_units) AS INTEGER) AS auto_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.stock_count_adjustment_units) AS INTEGER) AS stock_count_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.other_adjustment_units) AS INTEGER) AS other_adjustment_units\n\
    \        FROM STK_ADJ\n        GROUP BY 1, 2, 3\n    ),\n    -- Markdowns\n  \
    \  MKD AS (\n        SELECT\n            item_wid,\n            loc_wid AS loc_wid,\
    \ -- in this case location id defined as bigint\n            DATE '${LDTK_DATE}'\
    \ AS business_date,\n            listed_flag AS listing_flg\n        FROM DW${INSTANCE}A_ACC_ORR.DW_STOCK_MARKDOWN_DAILY_FV\
    \ AS MKD1\n        WHERE\n            MKD1.current_flag = 'Y'\n            AND\
    \ MKD1.status = 'L'\n            /* Get markdown at point in time */\n       \
    \     AND DATE '${LDTK_DATE}' BETWEEN MKD1.item_price_from_date AND MKD1.item_price_to_date\n\
    \            /* Only interested in markdowns */\n            AND MKD1.price_change_flag\
    \ = 'MARKDOWN'\n        QUALIFY ROW_NUMBER() OVER (PARTITION BY item_wid, loc_wid\
    \ ORDER BY item_price_from_date DESC, item_price_to_date DESC, effective_from_dt\
    \ DESC, effective_to_dt DESC) = 1\n    ),\n    -- Price Type\n    PRCT AS (\n\
    \        SELECT\n            IPD.item_wid,\n            IPD.loc_wid,\n       \
    \     DATE '${LDTK_DATE}' AS business_date,\n            price_change_type_code,\n\
    \            CAST(CAL.calendar_week_id AS INTEGER) AS price_action_week,\n   \
    \         unit_retail_price AS unit_retail_amount,\n            IPD.item_price_from_date\n\
    \        FROM DW${INSTANCE}A_ACC_ORR.DW_ITEM_PRICE_DETAIL_FV AS IPD\n        LEFT\
    \ OUTER JOIN DW${INSTANCE}A_ACC_ORR.DW_PMK_ACCNTG_CAL_DV AS CAL\n            ON\
    \ CAST(item_price_from_date AS DATE) = CAL.calendar_day_id\n            AND CAL.level_cd\
    \ = 'DY'\n            AND CAL.current_flg = 'Y'\n        WHERE\n            IPD.current_flag\
    \ = 'Y'\n            AND IPD.status LIKE '%executed%'\n            AND DATE '${LDTK_DATE}'\
    \ BETWEEN IPD.item_price_from_date AND IPD.item_price_to_date\n        /* Ellimnate\
    \ Duplicates this is in original code */\n        QUALIFY ROW_NUMBER() OVER (PARTITION\
    \ BY item_wid, loc_wid ORDER BY IPD.item_price_from_date, IPD.item_price_to_date\
    \ DESC) = 1\n    )\n -- main select To extract stock facts and calculated fields\n\
    SELECT\n    STK.stock_inventory_date AS business_date,\n    STK.location_wid AS\
    \ loc_wid,\n    STK.item_wid AS item_wid,\n    setbit((0 (INTEGER)), 0, 1) AS\
    \ fct_src_map,\n    STK.soh_units AS location_soh_units,\n    -- Only show depot\
    \ SOH units for warehouse locations\n    CASE\n        WHEN LC.loc_sbtype_cd =\
    \ 'W' THEN STK.soh_units\n    END AS depot_soh_units,\n    STK.soh_pack_units\
    \ AS location_pack_units,\n    -- Only show depot pack units for warehouse locations\n\
    \    CASE\n        WHEN LC.loc_sbtype_cd = 'W' THEN STK.soh_pack_units\n    END\
    \ AS depot_pack_units,\n    STK.soh_retail_amount AS location_retail_amount,\n\
    \    -- Only show depot retail amount for warehouse locations\n    CASE\n    \
    \    WHEN LC.loc_sbtype_cd = 'W' THEN STK.soh_retail_amount\n    END AS depot_retail_amount,\n\
    \    STK.soh_cost_amount AS unit_cost_amount,\n    STK.stock_unit_retail_amount\
    \ AS unit_retail_amount, /* Also SSBI1068 */\n    STK.on_order_units AS on_order_units,\n\
    \    STK.on_order_cost_amount AS on_order_cost_amount,\n    STK.on_order_retail_amount\
    \ AS on_order_retail_amount,\n    STK.on_order_pack_units AS on_order_pack_units,\n\
    \    STK.return_to_vendor_cost_amount AS return_to_vendor_cost_amount,\n    STK.return_to_vendor_retail_amount\
    \ AS return_to_vendor_retail_amount,\n    STK.return_to_vendor_units AS return_to_vendor_units,\n\
    \    STK.return_to_vendor_pack_units AS return_to_vendor_pack_units,\n    STK.transfer_expected_retail_amount\
    \ AS transfer_expected_retail_amount,\n    STK.transfer_expected_pack_units AS\
    \ transfer_expected_pack_units,\n    STK.transfer_reserved_cost_amount AS transfer_reserved_cost_amount,\n\
    \    STK.transfer_expected_units AS transfer_expected_units,\n    STK.transfer_reserved_retail_amount\
    \ AS transfer_reserved_retail_amount,\n    STK.transfer_reserved_pack_units AS\
    \ transfer_reserved_pack_units,\n    STK.transfer_expected_cost_amount AS transfer_expected_cost_amount,\n\
    \    STK.transfer_reserved_units AS transfer_reserved_units,\n    STK.in_transit_retail_amount\
    \ AS in_transit_retail_amount,\n    STK.in_transit_pack_units AS in_transit_pack_units,\n\
    \    STK.in_transit_units AS in_transit_units,\n    STK.in_transit_cost_amount\
    \ AS in_transit_cost_amount,\n    STK.non_sellable_retail_amount AS non_sellable_retail_amount,\n\
    \    STK.non_sellable_pack_units AS non_sellable_pack_units,\n    STK.non_sellable_cost_amount\
    \ AS non_sellable_cost_amount,\n    STK.non_sellable_units AS non_sellable_units,\n\
    \    -- PSR blocked fields: only set if item/location is in stpsel (stop sell)\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_units\n    END AS psr_blocked_units,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_retail_amount\n    END AS psr_retail_amount,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_pack_units\n    END AS psr_blocked_pack_units,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_cost_amount\n    END AS psr_blocked_cost_amount,\n\
    \    -- Carryover fields: only set if item is flagged as carryover\n    CASE\n\
    \        WHEN ITM.pmk_caryovr = 'Y'\n            THEN STK.soh_units\n        ELSE\
    \ 0\n    END AS carryover_units,\n    CASE\n        WHEN ITM.pmk_caryovr = 'Y'\n\
    \            THEN STK.soh_retail_amount\n        ELSE 0\n    END AS carryover_value,\n\
    \    STK.stock_unit_av_cost_amount AS stock_unit_av_cost_amount,\n    STK.regular_unit_retail_amt\
    \ AS regular_unit_retail_amt,\n    /* Adjustements SSBI1061 */\n    STADJ.damaged_adjustment_units\
    \ AS damaged_adjustment_units,\n    (STADJ.damaged_adjustment_units * STK.stock_unit_retail_amount)\
    \ AS damaged_adjustment_amount,\n    STADJ.soiled_adjustment_units AS soiled_adjustment_units,\n\
    \    (STADJ.soiled_adjustment_units * STK.stock_unit_retail_amount) AS soiled_adjustment_amount,\n\
    \    STADJ.auto_adjustment_units AS auto_adjustment_units,\n    (STADJ.auto_adjustment_units\
    \ * STK.stock_unit_retail_amount) AS auto_adjustment_amount,\n    STADJ.other_adjustment_units\
    \ AS other_adjustment_units,\n    (STADJ.other_adjustment_units * STK.stock_unit_retail_amount)\
    \ AS other_adjustment_amount,\n    STADJ.stock_count_adjustment_units AS stock_cnt_adj_units,\n\
    \    STADJ.stock_count_adjustment_units * STK.stock_unit_retail_amount AS stock_cnt_adj_retail_value,\n\
    \    /* Markdown Listed SSBI1069 */\n    CASE\n        WHEN MKD.listing_flg =\
    \ 'Y'\n            THEN STK.soh_units\n        ELSE 0\n    END AS listed_stock,\n\
    \    MKD.listing_flg AS listing_flg,\n    /* Price Statys SSBI1068 */\n    CASE\n\
    \        WHEN PRCT.price_change_type_code = 'P'\n            THEN (STK.soh_units\
    \ * COALESCE(PRCT.unit_retail_amount, STK.stock_unit_retail_amount))\n       \
    \ ELSE 0\n    END AS nlp_stock_value,\n    CASE\n        WHEN PRCT.price_change_type_code\
    \ = 'P'\n            THEN STK.soh_units\n        ELSE 0\n    END AS nlp_stock_units,\n\
    \    CASE\n        WHEN PRCT.price_change_type_code = 'C'\n            THEN STK.soh_units\n\
    \        ELSE 0\n    END AS ras_units,\n    CASE\n        WHEN PRCT.price_change_type_code\
    \ = 'C'\n            THEN (STK.soh_units * COALESCE(PRCT.unit_retail_amount, STK.stock_unit_retail_amount))\n\
    \        ELSE 0\n    END AS ras_stock_value,\n    PRCT.price_action_week AS price_action_week,\n\
    \    DECODE(PRCT.price_change_type_code, 'R', 'Regular', 'C', 'Clearance', 'P',\
    \ 'Promotion', 'Regular') AS price_status\nFROM DW${INSTANCE}A_ACC_ORR.DW_STOCK_POSITION_DY_FV\
    \ AS STK\n/* Join to LOC to get location type W and S */\nINNER JOIN DW${INSTANCE}A_IDW.LOC\
    \ AS LC\n    ON LC.loc_wid = STK.location_wid\n    AND LC.cur_flg = 'Y'\n    /*\
    \ Only stores and depot */\n    AND LC.loc_sbtype_cd IN ('W', 'S')\n/* Join to\
    \ Item  to get carry over indicator */\nINNER JOIN DW${INSTANCE}A_IDW.ITEM AS\
    \ ITM\n    ON ITM.item_wid = STK.item_wid\n    AND ITM.cur_flg = 'Y'\n/* Join\
    \ to stop sell to determine which items/sku */\nLEFT OUTER JOIN STPSEL\n    ON\
    \ STK.item_wid = STPSEL.item_wid\n    AND STK.location_wid = STPSEL.loc_wid\n\
    /* Join to Soiled and Damaged adjustments */\nLEFT OUTER JOIN STADJ\n    ON STK.item_wid\
    \ = STADJ.item_wid\n    AND STK.location_wid = STADJ.loc_wid\n    AND STK.stock_inventory_date\
    \ = STADJ.business_date\n/* Mark down listed flag */\nLEFT OUTER JOIN MKD\n  \
    \  ON STK.item_wid = MKD.item_wid\n    AND STK.location_wid = MKD.loc_wid\n  \
    \  AND STK.stock_inventory_date = MKD.business_date\nLEFT OUTER JOIN PRCT\n  \
    \  ON STK.item_wid = PRCT.item_wid\n    AND STK.location_wid = PRCT.loc_wid\n\
    \    AND STK.stock_inventory_date = PRCT.business_date\nWHERE\n    STK.stock_inventory_date\
    \ = DATE '${LDTK_DATE}'  /* Use RUNDATE */\n    -- Only include rows where at\
    \ least one stock or transfer metric is non-zero\n    AND (\n        /* Determine\
    \ if a row has some non-zero */\n        COALESCE(soh_units, 0) <> 0\n       \
    \ OR COALESCE(soh_pack_units, 0) <> 0\n        OR COALESCE(on_order_units, 0)\
    \ <> 0\n        OR COALESCE(on_order_pack_units, 0) <> 0\n        OR COALESCE(in_transit_units,\
    \ 0) <> 0\n        OR COALESCE(in_transit_pack_units, 0) <> 0\n        OR COALESCE(transfer_reserved_units,\
    \ 0) <> 0\n        OR COALESCE(transfer_reserved_pack_units, 0) <> 0\n       \
    \ OR COALESCE(transfer_expected_units, 0) <> 0\n        OR COALESCE(transfer_expected_pack_units,\
    \ 0) <> 0\n        OR COALESCE(non_sellable_units, 0) <> 0\n        OR COALESCE(non_sellable_pack_units,\
    \ 0) <> 0\n        OR COALESCE(return_to_vendor_units, 0) <> 0\n        OR COALESCE(return_to_vendor_pack_units,\
    \ 0) <> 0\n        OR COALESCE(soh_cost_amount, 0) <> 0\n        OR COALESCE(soh_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(on_order_cost_amount, 0) <> 0\n        OR COALESCE(on_order_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(in_transit_cost_amount, 0) <> 0\n        OR COALESCE(in_transit_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(transfer_reserved_cost_amount, 0) <> 0\n      \
    \  OR COALESCE(transfer_reserved_retail_amount, 0) <> 0\n        OR COALESCE(transfer_expected_cost_amount,\
    \ 0) <> 0\n        OR COALESCE(transfer_expected_retail_amount, 0) <> 0\n    \
    \    OR COALESCE(non_sellable_cost_amount, 0) <> 0\n        OR COALESCE(non_sellable_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(return_to_vendor_cost_amount, 0) <> 0\n       \
    \ OR COALESCE(return_to_vendor_retail_amount, 0) <> 0\n        OR COALESCE(damaged_adjustment_units,\
    \ 0) <> 0\n        OR COALESCE(soiled_adjustment_units, 0) <> 0\n        OR COALESCE(auto_adjustment_units,\
    \ 0) <> 0\n        OR COALESCE(other_adjustment_units, 0) <> 0\n        OR COALESCE(stock_cnt_adj_units,\
    \ 0) <> 0\n    )\n/* TODO: Remove before volume testing */\nSAMPLE 1000000\n;"
steps:
- description: ''
  file_name: ''
  file_present: false
  job_name: FND2102
  notes: ''
  post_sql: ''
  pre_sql: ''
  reverse_sequence_no: 3
  sequence_no: 1
  source_database: ''
  source_table: ''
  sql_statement: '/* ERROR : no steps found for this step */'
  stats: ''
  stats_target_database: ''
  step_pattern: STANDARD_START
  steps: Start
  target_database: ''
  target_table: ''
- description: Delete and insert into target
  file_name: FND2102.300.TARGET.sql
  file_present: true
  job_name: FND2102
  notes: See Mapping
  post_sql: ''
  pre_sql: ''
  reverse_sequence_no: 2
  sequence_no: 2
  source_database: ''
  source_table: ''
  sql_statement: "WITH\n    /* Stop Sell CTE  */\n    STPSEL AS (\n        SELECT\
    \ DISTINCT\n            item_wid,\n            loc_wid,\n            pmk_stop_sell\n\
    \        FROM DW${INSTANCE}A_IDW.PMK_LOC_ITEM AS PLI\n        WHERE\n        \
    \    cur_flg = 'Y'\n            AND pmk_stop_sell = 'Y'\n            AND ssor_id\
    \ = 4\n            AND level_cd = 'PSR_BLK'\n    ),\n    /* Soiled and Damaged\
    \ Adjustments */\n    /* This is a running weekly total */\n    INV_VOL AS (\n\
    \        SELECT\n            invtry_tsactn_id,\n            invtry_tsactn_wid,\n\
    \            loc_id,\n            loc_wid,\n            invtry_rsn_cd,\n     \
    \       pmk_tsactn_comts_txt,\n            eff_from_dttm,\n            eff_to_dttm,\n\
    \            cur_flg,\n            del_flg,\n            ssor_id,\n          \
    \  tsactn_type_cd\n        FROM DW${INSTANCE}A_IDW.INVTRY_TSACTN AS INV\n    \
    \    WHERE\n            (\n                TRUNC(INV.eff_from_dttm) BETWEEN DATE\
    \ '${LDTK_DATE}' AND DATE '${LDTK_DATE}' + 1\n                OR TRUNC(INV.eff_to_dttm)\
    \ BETWEEN DATE '${LDTK_DATE}' AND '${LDTK_DATE}' + 1\n            )\n        \
    \    AND INV.cur_flg = 'Y'\n            AND INV.ssor_id <> 3\n            AND\
    \ INV.tsactn_type_cd = 'STA'\n    ),\n    STK_ADJS_TY AS (\n        SELECT DISTINCT\
    \ -- Same as group by\n            I.invtry_tsactn_id AS stock_adjustment_id,\n\
    \            I.loc_id AS location_id,\n            I.loc_wid,\n            I.invtry_rsn_cd\
    \ AS stock_adjustment_reason_cd,\n            I.pmk_tsactn_comts_txt AS stock_adjustment_comment,\n\
    \            ITM.item_id AS item_id,\n            ITM.item_wid,\n            ITM.cmpltn_dttm\
    \ AS stock_adjustment_date,\n            ITM.item_adjst_qty AS stock_adjustment_units,\n\
    \            I.eff_from_dttm AS effective_from_dt,\n            I.eff_to_dttm\
    \ AS effective_to_dt,\n            CASE WHEN I.cur_flg || ITM.cur_flg = 'YY' THEN\
    \ 'Y' ELSE 'N' END AS current_flg,\n            I.del_flg AS delete_flg,\n   \
    \         I.ssor_id AS src_system_id\n        FROM INV_VOL AS I\n        INNER\
    \ JOIN DW${INSTANCE}A_IDW.INVTRY_TSACTN_ITEM AS ITM\n            ON I.invtry_tsactn_wid\
    \ = ITM.invtry_tsactn_wid\n                AND I.invtry_tsactn_id = ITM.invtry_tsactn_id\n\
    \                AND I.tsactn_type_cd = 'STA'\n                AND ITM.ssor_id\
    \ <> 3\n        WHERE\n            I.ssor_id <> 3\n    ),\n    STK_ADJ AS (\n\
    \        SELECT\n            loc_wid,\n            item_wid,\n            /* Always\
    \ use \"RUNDATE\" */\n            DATE '${LDTK_DATE}' AS business_date,\n    \
    \        CASE\n                WHEN stock_adjustment_reason_cd IN (110, 522, 82,\
    \ 560, 81, 707)\n                    THEN stock_adjustment_units\n           \
    \ END AS damaged_adjustment_units,\n            CASE\n                WHEN stock_adjustment_reason_cd\
    \ IN (703, 704, 714, 724, 725)\n                    THEN stock_adjustment_units\n\
    \            END AS soiled_adjustment_units,\n            CASE\n             \
    \   WHEN stock_adjustment_reason_cd IN (721, 720)\n                    THEN stock_adjustment_units\n\
    \            END AS auto_adjustment_units,\n            CASE\n               \
    \ WHEN stock_adjustment_reason_cd IN (141)\n                    THEN stock_adjustment_units\n\
    \            END AS stock_count_adjustment_units,\n            CASE\n        \
    \        WHEN stock_adjustment_reason_cd IS NULL\n                    THEN 0.0000\n\
    \                WHEN stock_adjustment_reason_cd NOT IN (110, 522, 82, 560, 81,\
    \ 714, 721, 720, 707, 703, 704, 724, 725)\n                    THEN stock_adjustment_units\n\
    \            END AS other_adjustment_units\n        FROM STK_ADJS_TY AS STK_ADJS_TY\
    \ --RFC 17880/CHG0031571- CAST AS DATE APPLIED\n        WHERE\n            current_flg\
    \ = 'Y'\n            /* Get a accrued adjustment total for the week , so the date\
    \ range will be from sunday - start of week\n               to end of week */\n\
    \            /* Use RUNDATE AS date '2025-08-07' */\n            AND CAST(STK_ADJS_TY.stock_adjustment_date\
    \ AS DATE) BETWEEN TD_SUNDAY(DATE '${LDTK_DATE}') AND TD_SUNDAY(DATE '${LDTK_DATE}')\
    \ + 6\n    ),\n    STADJ AS (\n        SELECT\n            STK_ADJ.loc_wid,\n\
    \            STK_ADJ.item_wid,\n            STK_ADJ.business_date,\n         \
    \   CAST(SUM(STK_ADJ.damaged_adjustment_units) AS INTEGER) AS damaged_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.soiled_adjustment_units) AS INTEGER) AS soiled_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.auto_adjustment_units) AS INTEGER) AS auto_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.stock_count_adjustment_units) AS INTEGER) AS stock_count_adjustment_units,\n\
    \            CAST(SUM(STK_ADJ.other_adjustment_units) AS INTEGER) AS other_adjustment_units\n\
    \        FROM STK_ADJ\n        GROUP BY 1, 2, 3\n    ),\n    -- Markdowns\n  \
    \  MKD AS (\n        SELECT\n            item_wid,\n            loc_wid AS loc_wid,\
    \ -- in this case location id defined as bigint\n            DATE '${LDTK_DATE}'\
    \ AS business_date,\n            listed_flag AS listing_flg\n        FROM DW${INSTANCE}A_ACC_ORR.DW_STOCK_MARKDOWN_DAILY_FV\
    \ AS MKD1\n        WHERE\n            MKD1.current_flag = 'Y'\n            AND\
    \ MKD1.status = 'L'\n            /* Get markdown at point in time */\n       \
    \     AND DATE '${LDTK_DATE}' BETWEEN MKD1.item_price_from_date AND MKD1.item_price_to_date\n\
    \            /* Only interested in markdowns */\n            AND MKD1.price_change_flag\
    \ = 'MARKDOWN'\n        QUALIFY ROW_NUMBER() OVER (PARTITION BY item_wid, loc_wid\
    \ ORDER BY item_price_from_date DESC, item_price_to_date DESC, effective_from_dt\
    \ DESC, effective_to_dt DESC) = 1\n    ),\n    -- Price Type\n    PRCT AS (\n\
    \        SELECT\n            IPD.item_wid,\n            IPD.loc_wid,\n       \
    \     DATE '${LDTK_DATE}' AS business_date,\n            price_change_type_code,\n\
    \            CAST(CAL.calendar_week_id AS INTEGER) AS price_action_week,\n   \
    \         unit_retail_price AS unit_retail_amount,\n            IPD.item_price_from_date\n\
    \        FROM DW${INSTANCE}A_ACC_ORR.DW_ITEM_PRICE_DETAIL_FV AS IPD\n        LEFT\
    \ OUTER JOIN DW${INSTANCE}A_ACC_ORR.DW_PMK_ACCNTG_CAL_DV AS CAL\n            ON\
    \ CAST(item_price_from_date AS DATE) = CAL.calendar_day_id\n            AND CAL.level_cd\
    \ = 'DY'\n            AND CAL.current_flg = 'Y'\n        WHERE\n            IPD.current_flag\
    \ = 'Y'\n            AND IPD.status LIKE '%executed%'\n            AND DATE '${LDTK_DATE}'\
    \ BETWEEN IPD.item_price_from_date AND IPD.item_price_to_date\n        /* Ellimnate\
    \ Duplicates this is in original code */\n        QUALIFY ROW_NUMBER() OVER (PARTITION\
    \ BY item_wid, loc_wid ORDER BY IPD.item_price_from_date, IPD.item_price_to_date\
    \ DESC) = 1\n    )\n -- main select To extract stock facts and calculated fields\n\
    SELECT\n    STK.stock_inventory_date AS business_date,\n    STK.location_wid AS\
    \ loc_wid,\n    STK.item_wid AS item_wid,\n    setbit((0 (INTEGER)), 0, 1) AS\
    \ fct_src_map,\n    STK.soh_units AS location_soh_units,\n    -- Only show depot\
    \ SOH units for warehouse locations\n    CASE\n        WHEN LC.loc_sbtype_cd =\
    \ 'W' THEN STK.soh_units\n    END AS depot_soh_units,\n    STK.soh_pack_units\
    \ AS location_pack_units,\n    -- Only show depot pack units for warehouse locations\n\
    \    CASE\n        WHEN LC.loc_sbtype_cd = 'W' THEN STK.soh_pack_units\n    END\
    \ AS depot_pack_units,\n    STK.soh_retail_amount AS location_retail_amount,\n\
    \    -- Only show depot retail amount for warehouse locations\n    CASE\n    \
    \    WHEN LC.loc_sbtype_cd = 'W' THEN STK.soh_retail_amount\n    END AS depot_retail_amount,\n\
    \    STK.soh_cost_amount AS unit_cost_amount,\n    STK.stock_unit_retail_amount\
    \ AS unit_retail_amount, /* Also SSBI1068 */\n    STK.on_order_units AS on_order_units,\n\
    \    STK.on_order_cost_amount AS on_order_cost_amount,\n    STK.on_order_retail_amount\
    \ AS on_order_retail_amount,\n    STK.on_order_pack_units AS on_order_pack_units,\n\
    \    STK.return_to_vendor_cost_amount AS return_to_vendor_cost_amount,\n    STK.return_to_vendor_retail_amount\
    \ AS return_to_vendor_retail_amount,\n    STK.return_to_vendor_units AS return_to_vendor_units,\n\
    \    STK.return_to_vendor_pack_units AS return_to_vendor_pack_units,\n    STK.transfer_expected_retail_amount\
    \ AS transfer_expected_retail_amount,\n    STK.transfer_expected_pack_units AS\
    \ transfer_expected_pack_units,\n    STK.transfer_reserved_cost_amount AS transfer_reserved_cost_amount,\n\
    \    STK.transfer_expected_units AS transfer_expected_units,\n    STK.transfer_reserved_retail_amount\
    \ AS transfer_reserved_retail_amount,\n    STK.transfer_reserved_pack_units AS\
    \ transfer_reserved_pack_units,\n    STK.transfer_expected_cost_amount AS transfer_expected_cost_amount,\n\
    \    STK.transfer_reserved_units AS transfer_reserved_units,\n    STK.in_transit_retail_amount\
    \ AS in_transit_retail_amount,\n    STK.in_transit_pack_units AS in_transit_pack_units,\n\
    \    STK.in_transit_units AS in_transit_units,\n    STK.in_transit_cost_amount\
    \ AS in_transit_cost_amount,\n    STK.non_sellable_retail_amount AS non_sellable_retail_amount,\n\
    \    STK.non_sellable_pack_units AS non_sellable_pack_units,\n    STK.non_sellable_cost_amount\
    \ AS non_sellable_cost_amount,\n    STK.non_sellable_units AS non_sellable_units,\n\
    \    -- PSR blocked fields: only set if item/location is in stpsel (stop sell)\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_units\n    END AS psr_blocked_units,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_retail_amount\n    END AS psr_retail_amount,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_pack_units\n    END AS psr_blocked_pack_units,\n\
    \    CASE\n        WHEN STPSEL.pmk_stop_sell IS NULL\n            OR STPSEL.pmk_stop_sell\
    \ = 'N'\n            THEN 0\n        ELSE STK.soh_cost_amount\n    END AS psr_blocked_cost_amount,\n\
    \    -- Carryover fields: only set if item is flagged as carryover\n    CASE\n\
    \        WHEN ITM.pmk_caryovr = 'Y'\n            THEN STK.soh_units\n        ELSE\
    \ 0\n    END AS carryover_units,\n    CASE\n        WHEN ITM.pmk_caryovr = 'Y'\n\
    \            THEN STK.soh_retail_amount\n        ELSE 0\n    END AS carryover_value,\n\
    \    STK.stock_unit_av_cost_amount AS stock_unit_av_cost_amount,\n    STK.regular_unit_retail_amt\
    \ AS regular_unit_retail_amt,\n    /* Adjustements SSBI1061 */\n    STADJ.damaged_adjustment_units\
    \ AS damaged_adjustment_units,\n    (STADJ.damaged_adjustment_units * STK.stock_unit_retail_amount)\
    \ AS damaged_adjustment_amount,\n    STADJ.soiled_adjustment_units AS soiled_adjustment_units,\n\
    \    (STADJ.soiled_adjustment_units * STK.stock_unit_retail_amount) AS soiled_adjustment_amount,\n\
    \    STADJ.auto_adjustment_units AS auto_adjustment_units,\n    (STADJ.auto_adjustment_units\
    \ * STK.stock_unit_retail_amount) AS auto_adjustment_amount,\n    STADJ.other_adjustment_units\
    \ AS other_adjustment_units,\n    (STADJ.other_adjustment_units * STK.stock_unit_retail_amount)\
    \ AS other_adjustment_amount,\n    STADJ.stock_count_adjustment_units AS stock_cnt_adj_units,\n\
    \    STADJ.stock_count_adjustment_units * STK.stock_unit_retail_amount AS stock_cnt_adj_retail_value,\n\
    \    /* Markdown Listed SSBI1069 */\n    CASE\n        WHEN MKD.listing_flg =\
    \ 'Y'\n            THEN STK.soh_units\n        ELSE 0\n    END AS listed_stock,\n\
    \    MKD.listing_flg AS listing_flg,\n    /* Price Statys SSBI1068 */\n    CASE\n\
    \        WHEN PRCT.price_change_type_code = 'P'\n            THEN (STK.soh_units\
    \ * COALESCE(PRCT.unit_retail_amount, STK.stock_unit_retail_amount))\n       \
    \ ELSE 0\n    END AS nlp_stock_value,\n    CASE\n        WHEN PRCT.price_change_type_code\
    \ = 'P'\n            THEN STK.soh_units\n        ELSE 0\n    END AS nlp_stock_units,\n\
    \    CASE\n        WHEN PRCT.price_change_type_code = 'C'\n            THEN STK.soh_units\n\
    \        ELSE 0\n    END AS ras_units,\n    CASE\n        WHEN PRCT.price_change_type_code\
    \ = 'C'\n            THEN (STK.soh_units * COALESCE(PRCT.unit_retail_amount, STK.stock_unit_retail_amount))\n\
    \        ELSE 0\n    END AS ras_stock_value,\n    PRCT.price_action_week AS price_action_week,\n\
    \    DECODE(PRCT.price_change_type_code, 'R', 'Regular', 'C', 'Clearance', 'P',\
    \ 'Promotion', 'Regular') AS price_status\nFROM DW${INSTANCE}A_ACC_ORR.DW_STOCK_POSITION_DY_FV\
    \ AS STK\n/* Join to LOC to get location type W and S */\nINNER JOIN DW${INSTANCE}A_IDW.LOC\
    \ AS LC\n    ON LC.loc_wid = STK.location_wid\n    AND LC.cur_flg = 'Y'\n    /*\
    \ Only stores and depot */\n    AND LC.loc_sbtype_cd IN ('W', 'S')\n/* Join to\
    \ Item  to get carry over indicator */\nINNER JOIN DW${INSTANCE}A_IDW.ITEM AS\
    \ ITM\n    ON ITM.item_wid = STK.item_wid\n    AND ITM.cur_flg = 'Y'\n/* Join\
    \ to stop sell to determine which items/sku */\nLEFT OUTER JOIN STPSEL\n    ON\
    \ STK.item_wid = STPSEL.item_wid\n    AND STK.location_wid = STPSEL.loc_wid\n\
    /* Join to Soiled and Damaged adjustments */\nLEFT OUTER JOIN STADJ\n    ON STK.item_wid\
    \ = STADJ.item_wid\n    AND STK.location_wid = STADJ.loc_wid\n    AND STK.stock_inventory_date\
    \ = STADJ.business_date\n/* Mark down listed flag */\nLEFT OUTER JOIN MKD\n  \
    \  ON STK.item_wid = MKD.item_wid\n    AND STK.location_wid = MKD.loc_wid\n  \
    \  AND STK.stock_inventory_date = MKD.business_date\nLEFT OUTER JOIN PRCT\n  \
    \  ON STK.item_wid = PRCT.item_wid\n    AND STK.location_wid = PRCT.loc_wid\n\
    \    AND STK.stock_inventory_date = PRCT.business_date\nWHERE\n    STK.stock_inventory_date\
    \ = DATE '${LDTK_DATE}'  /* Use RUNDATE */\n    -- Only include rows where at\
    \ least one stock or transfer metric is non-zero\n    AND (\n        /* Determine\
    \ if a row has some non-zero */\n        COALESCE(soh_units, 0) <> 0\n       \
    \ OR COALESCE(soh_pack_units, 0) <> 0\n        OR COALESCE(on_order_units, 0)\
    \ <> 0\n        OR COALESCE(on_order_pack_units, 0) <> 0\n        OR COALESCE(in_transit_units,\
    \ 0) <> 0\n        OR COALESCE(in_transit_pack_units, 0) <> 0\n        OR COALESCE(transfer_reserved_units,\
    \ 0) <> 0\n        OR COALESCE(transfer_reserved_pack_units, 0) <> 0\n       \
    \ OR COALESCE(transfer_expected_units, 0) <> 0\n        OR COALESCE(transfer_expected_pack_units,\
    \ 0) <> 0\n        OR COALESCE(non_sellable_units, 0) <> 0\n        OR COALESCE(non_sellable_pack_units,\
    \ 0) <> 0\n        OR COALESCE(return_to_vendor_units, 0) <> 0\n        OR COALESCE(return_to_vendor_pack_units,\
    \ 0) <> 0\n        OR COALESCE(soh_cost_amount, 0) <> 0\n        OR COALESCE(soh_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(on_order_cost_amount, 0) <> 0\n        OR COALESCE(on_order_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(in_transit_cost_amount, 0) <> 0\n        OR COALESCE(in_transit_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(transfer_reserved_cost_amount, 0) <> 0\n      \
    \  OR COALESCE(transfer_reserved_retail_amount, 0) <> 0\n        OR COALESCE(transfer_expected_cost_amount,\
    \ 0) <> 0\n        OR COALESCE(transfer_expected_retail_amount, 0) <> 0\n    \
    \    OR COALESCE(non_sellable_cost_amount, 0) <> 0\n        OR COALESCE(non_sellable_retail_amount,\
    \ 0) <> 0\n        OR COALESCE(return_to_vendor_cost_amount, 0) <> 0\n       \
    \ OR COALESCE(return_to_vendor_retail_amount, 0) <> 0\n        OR COALESCE(damaged_adjustment_units,\
    \ 0) <> 0\n        OR COALESCE(soiled_adjustment_units, 0) <> 0\n        OR COALESCE(auto_adjustment_units,\
    \ 0) <> 0\n        OR COALESCE(other_adjustment_units, 0) <> 0\n        OR COALESCE(stock_cnt_adj_units,\
    \ 0) <> 0\n    )\n/* TODO: Remove before volume testing */\nSAMPLE 1000000\n;"
