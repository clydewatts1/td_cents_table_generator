sql_steps:
  FND1040.190.TRANS: "    SELECT\n        stl.styl_wid,\n        stl.item_sbclas_wid\n\
    \    FROM DW${INSTANCE}A_IDW.STYL AS stl\n    WHERE \n        -- eff to must be\
    \ greater than eff from \n        -- this is needed because of incorret data in\
    \ table\n        stl.eff_to_dttm >  stl.eff_from_dttm\n        -- load token date\
    \ needs to be moved up by 1 so that the EOD position is caught\n        -- CONTAINS\
    \ is used to handle the Period data type\n        AND  PERIOD(stl.eff_from_dttm,\
    \ stl.eff_to_dttm) CONTAINS ((date '${LDTK_DATE}' + 1)(TIMESTAMP(0)))\n      \
    \  -- this is to handle incorrectly implemented soft deletes\n        AND (\n\
    \             --- if end date high and cur_flg=Y and del_flg=Y -- this is to hand\
    \ the case where the eff_to is high and cur_flg=N , simulating a soft delete\n\
    \             ( stl.eff_to_dttm = timestamp '3500-12-01 00:00:00' AND CUR_FLG\
    \ = 'Y' AND DEL_FLG='N')\n             -- this is standard need it to handle the\
    \ exception above\n             OR ( stl.eff_to_dttm <> timestamp '3500-12-01\
    \ 00:00:00'  AND DEL_FLG='N')\n            )"
