sql_steps:
  FND2104.300.TARGET: "/*\nThis MERGE statement updates the target pivot table (FND_STK_FCT_PVT_STG)\n\
    from the source staging table (FND_STK_FCT_01_FCT_STG).\nKey Logic:\n1. Records\
    \ are matched on business_date, loc_wid, and item_wid.\n2. WHEN MATCHED:\n   -\
    \ The fct_src_map is updated using a bitwise OR (BITOR).\n   - This combines the\
    \ bitmask from the target with the bitmask from the source,\n     preserving a\
    \ history of all data sources that have contributed to the record.\n     For example,\
    \ if T.fct_src_map is 1 (binary 0001) and S.fct_src_map is 2 (binary 0010),\n\
    \     the result will be 3 (binary 0011).\n3. WHEN NOT MATCHED:\n   - A new record\
    \ is inserted into the target table with the data from the source.\n*/\nMERGE\
    \ INTO DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_PVT_STG AS T\nUSING DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_01_FCT_STG\
    \ AS S\n   ON T.business_date = S.business_date\n  AND T.loc_wid = S.loc_wid\n\
    \  AND T.item_wid = S.item_wid\nWHEN MATCHED THEN\n   UPDATE SET\n      fct_src_map\
    \ = BITOR(T.fct_src_map, S.fct_src_map)\nWHEN NOT MATCHED THEN\n   INSERT (\n\
    \      business_date,\n      loc_wid,\n      item_wid,\n      fct_src_map\n  \
    \ )\n   VALUES (\n      S.business_date,\n      S.loc_wid,\n      S.item_wid,\n\
    \      S.fct_src_map\n   );"
