sql_steps:
  FND2230.300.TARGET: "-- =================================================================================================\n\
    -- Populates the daily aggregated sales fact table by joining the pivoted staging\
    \ table\n-- with the source fact staging table.\n--\n-- Template: FND2130_SAMPLE.sql\n\
    -- Data: FND2230_Data.sql\n--\n-- Business Logic:\n-- 1. Uses FND_SLS_FCT_PVT_STG\
    \ as the driver to ensure all combinations of\n--    business_date, loc_wid, and\
    \ item_wid are included.\n-- 2. LEFT JOINs to FND_SLS_FCT_01_FCT_STG to retrieve\
    \ the actual sales measures.\n-- 3. COALESCE is used on all measure columns to\
    \ convert NULLs to 0.\n-- 4. Default values (0 or NULL) are provided for target\
    \ columns that do not have a direct source.\n-- 5. The script is designed to be\
    \ re-runnable by deleting the data for the target\n--    business date before\
    \ insertion.\n-- =================================================================================================\n\
    -- Start a new transaction. This ensures that all subsequent operations are treated\
    \ as a single\n-- atomic unit of work. If any step fails, the entire transaction\
    \ can be rolled back.\nBEGIN TRANSACTION;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n\
    -- Lock the target table in WRITE mode to prevent other processes from modifying\
    \ it during the load.\n-- This ensures data consistency.\nLOCKING TABLE DW${INSTANCE}T_ACC_FND.DW_FND_LOC_AGG_DAILY_SALES_FCT\
    \ FOR WRITE;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Before inserting new data,\
    \ delete any existing records for the target business date.\n-- This makes the\
    \ script re-runnable without creating duplicate data.\nDELETE FROM DW${INSTANCE}T_ACC_FND.DW_FND_LOC_AGG_DAILY_SALES_FCT\n\
    WHERE\n    business_dt = date '${LDTK_DATE}'\n;\n.IF ERRORCODE <> 0 THEN .QUIT\
    \ 101;\n-- Insert the aggregated data into the final fact table.\nINSERT INTO\
    \ DW${INSTANCE}T_ACC_FND.DW_FND_LOC_AGG_DAILY_SALES_FCT (\n    business_dt,\n\
    \    loc_wid,\n    item_wid,\n    sales_value,\n    sales_units,\n    sales_transaction_count,\n\
    \    promotion_sales_value,\n    promotion_sales_units,\n    promotion_sales_transaction_count,\n\
    \    clearance_sales_value,\n    clearance_sales_units,\n    clearance_sales_transaction_count,\n\
    \    regular_sales_value,\n    regular_sales_units,\n    regular_sales_transaction_count,\n\
    \    emp_discount_sales_value,\n    emp_discount_sales_units,\n    emp_discount_sales_transaction_count,\n\
    \    cash_sales_value,\n    cash_sales_units,\n    cash_sales_transaction_count,\n\
    \    card_sales_value,\n    card_sales_units,\n    card_sales_transaction_count,\n\
    \    gift_sales_value,\n    gift_sales_units,\n    gift_sales_transaction_count,\n\
    \    others_sales_value,\n    others_sales_units,\n    others_sales_transaction_count,\n\
    \    return_value,\n    return_units,\n    return_transaction_count,\n    promotion_return_value,\n\
    \    promotion_return_units,\n    promotion_return_transaction_count,\n    clearance_return_value,\n\
    \    clearance_return_units,\n    clearance_return_transaction_count,\n    regular_return_value,\n\
    \    regular_return_units,\n    regular_return_transaction_count,\n    emp_discount_return_value,\n\
    \    emp_discount_return_units,\n    emp_discount_return_transaction_count,\n\
    \    cash_return_value,\n    cash_return_units,\n    cash_return_transaction_count,\n\
    \    card_return_value,\n    card_return_units,\n    card_return_transaction_count,\n\
    \    gift_return_value,\n    gift_return_units,\n    gift_return_transaction_count,\n\
    \    others_return_value,\n    others_return_units,\n    others_return_transaction_count,\n\
    \    exchange_value,\n    exchange_units,\n    exchange_transaction_count,\n \
    \   promotion_exchange_value,\n    promotion_exchange_units,\n    promotion_exchange_transaction_count,\n\
    \    clearance_exchange_value,\n    clearance_exchange_units,\n    clearance_exchange_transaction_count,\n\
    \    regular_exchange_value,\n    regular_exchange_units,\n    regular_exchange_transaction_count,\n\
    \    emp_discount_exchange_value,\n    emp_discount_exchange_units,\n    emp_discount_exchange_transaction_count,\n\
    \    cash_exchange_value,\n    cash_exchange_units,\n    cash_exchange_transaction_count,\n\
    \    card_exchange_value,\n    card_exchange_units,\n    card_exchange_transaction_count,\n\
