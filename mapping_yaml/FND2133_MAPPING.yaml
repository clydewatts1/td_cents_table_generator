primary_key:
- business_date
- location_id
- item_id
sql_steps:
  FND2133.300.TARGET: "-- =================================================================================================\n\
    -- This BTEQ script manages the daily stock pivot table (DW_FND_LOC_ITEM_PVT_FCT).\n\
    -- It ensures that for a given business date (yesterday), the table accurately\
    \ reflects\n-- which location-item combinations have stock records by setting\
    \ a flag (ty_stock_ind).\n--\n-- Logic Overview:\n-- 1.  Start a transaction to\
    \ ensure atomicity.\n-- 2.  Lock the target table to prevent concurrent modifications.\n\
    -- 3.  Reset the stock indicator flag for all records for the target business\
    \ date.\n-- 4.  Merge data from the daily staging table (FND_STK_FCT_PVT_STG).\n\
    --     - If a location-item record already exists, update its stock flag.\n--\
    \     - If it's a new location-item combination, insert a new record.\n-- 5. \
    \ Commit the transaction upon successful completion.\n-- =================================================================================================\n\
    -- Step 1: Begin a transaction block. All subsequent operations will be treated\
    \ as a single\n-- atomic unit. If any step fails, the entire transaction will\
    \ be rolled back.\nBEGIN TRANSACTION;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n--\
    \ Step 2: Lock the target table in WRITE mode. This is a crucial step to ensure\
    \ data consistency\n-- by preventing other processes from modifying the table\
    \ during the merge operation.\nLOCKING TABLE DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT\
    \ FOR WRITE;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Step 3: Reset the stock indicator\
    \ for the target business date (yesterday).\n-- This is a safety measure to ensure\
    \ that if an item had stock previously but doesn't\n-- in the current run, its\
    \ flag is correctly set to '0' before the merge.\nUPDATE DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT\n\
    SET\n    ty_stock_ind = 0\nWHERE\n    business_date = date '${EFF_FROM_DT}';\n\
    .IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Step 4: Merge the source staging data into\
    \ the pivot fact table.\n-- The MERGE statement is an efficient way to handle\
    \ both inserts and updates in a single pass.\nMERGE INTO DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT\
    \ AS trg\nUSING DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_PVT_STG AS src\n    --\
    \ Define the join condition to match records between the source and target tables.\n\
    \    ON trg.business_date = src.business_date\n    AND trg.loc_id = src.location_id\n\
    \    AND trg.item_id = src.item_id\n-- 'WHEN MATCHED': This clause executes if\
    \ a record from the source table finds a\n-- matching record in the target table\
    \ based on the join condition.\nWHEN MATCHED THEN\n    UPDATE SET\n        --\
    \ Set the stock indicator to '1' to signify that this item has a stock\n     \
    \   -- record for the given business date.\n        ty_stock_ind = 1,\n      \
    \  -- Update the audit columns to track when this record was last updated.\n \
    \       update_run_id = ${RUNID}, -- Placeholder for the run ID\n        update_job_id\
    \ = '${JOB}' -- The name of the job that is running this script.\n-- 'WHEN NOT\
    \ MATCHED': This clause executes if a record from the source table does not\n\
    -- find a matching record in the target table. This indicates a new location-item\
    \ combination.\nWHEN NOT MATCHED THEN\n    INSERT (\n        business_date,\n\
    \        loc_id,\n        item_id,\n        ty_stock_ind,\n        wk_business_date,\n\
    \        ly_business_date,\n        eff_from_dt,\n        eff_to_dt,\n       \
    \ del_ind,\n        run_id,\n        update_run_id,\n        job_id,\n       \
    \ update_job_id\n    )\n    VALUES (\n        src.business_date,\n        src.location_id,\n\
    \        src.item_id,\n        1, -- Set the stock indicator to '1' for the new\
    \ record.\n        date '${WEEK_START_DT}', -- Teradata function to get the date\
    \ of the Saturday of the week.\n        date '${LY_CALENDAR_DT}', -- Calculate\
    \ the date for the same day last year (approximated).\n        date '${EFF_FROM_DT}',\
    \ -- The effective start date for this record.\n        DATE '3500-12-31', --\
    \ A high-date to indicate the record is currently active.\n        0, -- Deletion\
    \ indicator; 0 means the record is active.\n        ${RUNID}, -- Placeholder for\
    \ the initial run ID.\n        NULL, -- update_run_id is NULL for new records.\n\
    \        '${JOB}', -- The name of the job that created this record.\n        NULL\
    \ -- update_job_id is NULL for new records.\n    );\n-- BTEQ command to check\
    \ for errors after the MERGE statement. If an error occurred,\n-- the script will\
    \ exit with a status code of 101.\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Step\
    \ 5: End the transaction. If all previous steps were successful, the changes\n\
    -- are committed to the database, making them permanent.\nEND TRANSACTION;\n.IF\
    \ ERRORCODE <> 0 THEN .QUIT 101;"
