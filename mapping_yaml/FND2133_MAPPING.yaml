primary_key:
- business_date
- loc_wid
- item_wid
sql_steps:
  FND2133.300.TARGET: "-- =================================================================================================\n\
    -- SCRIPT: Manages the daily stock pivot table (DW_FND_LOC_ITEM_PVT_FCT).\n--\n\
    -- PURPOSE: This script updates the pivot table to indicate which location-item\
    \ combinations\n-- have stock for a given business date. It uses a staging table\
    \ to efficiently\n-- merge daily stock data, setting a 'ty_stock_ind' flag for\
    \ items in stock.\n--\n-- LOGIC:\n-- 1. Lock the target table to prevent conflicts.\n\
    -- 2. Reset the stock flag for the given week to handle items that are no longer\
    \ in stock.\n-- 3. Merge today's stock data, updating existing records and inserting\
    \ new ones.\n-- 4. Merge last year's stock data to update the 'ly_stock_ind' for\
    \ historical comparison.\n-- 5. All operations are performed within a single transaction\
    \ to ensure atomicity.\n-- =================================================================================================\n\
    -- Begin a transaction to ensure all operations are completed as a single atomic\
    \ unit.\nBEGIN TRANSACTION;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Lock the target\
    \ table to prevent other processes from modifying it during the update.\nLOCKING\
    \ TABLE DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT FOR WRITE;\n.IF ERRORCODE\
    \ <> 0 THEN .QUIT 101;\n-- Reset the stock indicator for the entire week before\
    \ applying daily updates.\n-- This ensures that items without new stock records\
    \ are correctly flagged as out of stock.\nUPDATE DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT\n\
    SET\n    ty_stock_ind = 0\nWHERE\n    business_date BETWEEN date '${WEEK_START_DT}'\
    \ AND date '${WEEK_END_DT}';\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Merge daily\
    \ stock data from the staging table into the main pivot table.\n-- This handles\
    \ both updates to existing location-item pairs and inserts for new ones.\nMERGE\
    \ INTO DW${INSTANCE}V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT AS trg\nUSING DW${INSTANCE}T_TMP_ACC_FND.FND_STK_FCT_PVT_STG\
    \ AS src\n    -- Match records on business_date, location, and item.\n    ON trg.business_date\
    \ = src.business_date\n    AND trg.loc_wid = src.loc_wid\n    AND trg.item_wid\
    \ = src.item_wid\n-- If a matching record exists, update its stock flag and audit\
    \ columns.\nWHEN MATCHED THEN\n    UPDATE SET\n        ty_stock_ind = 1, -- Set\
    \ flag to 1 to indicate stock for the day.\n        update_run_id = ${RUNID},\n\
    \        update_job_id = '${JOB}'\n-- If no matching record exists, insert a new\
    \ row for the new location-item combination.\nWHEN NOT MATCHED THEN\n    INSERT\
    \ (\n        business_date, loc_wid, item_wid, ty_stock_ind,\n        ty_wk_business_date,\
    \ ly_business_date, ly_wk_business_date, lw_business_date,\n        eff_from_dt,\
    \ eff_to_dt, del_ind,\n        run_id, update_run_id, job_id, update_job_id\n\
    \    )\n    VALUES (\n        src.business_date, src.loc_wid, src.item_wid, 1,\
    \ -- New record, so set stock flag to 1.\n        date '${WEEK_END_DT}', -- End\
    \ of the current business week.\n        date '${LY_CALENDAR_DT}', -- Corresponding\
    \ date from the previous year.\n        td_saturday(td_sunday(date '${WEEK_END_DT}')+1),\
    \ -- End of the business week from the previous year.\n        date '${WEEK_END_DT}'\
    \ - 7, -- Corresponding date from the previous week.\n        date '${EFF_FROM_DT}',\
    \ -- Effective start date for the record.\n        DATE '3500-12-31', -- High-date\
    \ indicating the record is currently active.\n        0, -- Deletion indicator;\
    \ 0 means active.\n        ${RUNID}, NULL, -- Initial run ID; update_run_id is\
    \ NULL for new records.\n        '${JOB}', NULL -- Initial job ID; update_job_id\
    \ is NULL for new records.\n    );\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Merge\
    \ last year's stock data to populate the 'ly_stock_ind' flag.\n-- This self-join\
    \ allows for year-over-year stock comparison on the same record.\nMERGE INTO DWT04V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT\
    \ AS trg\nUSING DWT04V_ACC_FND.DW_FND_LOC_ITEM_PVT_FCT AS src\n    -- Match today's\
    \ records with the corresponding records from last year.\n    ON trg.business_date\
    \ = date '${LDTK_DATE}' -- Today's date.\n    AND src.business_date = date '${LY_CALENDAR_DT}'\
    \ -- Corresponding date from last year.\n    AND trg.loc_wid = src.loc_wid\n \
    \   AND trg.item_wid = src.item_wid\n-- If a match is found, update the 'ly_stock_ind'\
    \ flag to indicate there was stock last year.\nWHEN MATCHED THEN\n    UPDATE SET\n\
    \        ly_stock_ind = 1,\n        update_run_id =${RUNID},\n        update_job_id\
    \ = '${JOB}'\n-- If no match is found for today's date, insert a new record to\
    \ capture last year's stock data.\nWHEN NOT MATCHED THEN\n    INSERT (\n     \
    \   business_date, loc_wid, item_wid, ly_stock_ind,\n        ty_wk_business_date,\
    \ ly_business_date, ly_wk_business_date, lw_business_date,\n        eff_from_dt,\
    \ eff_to_dt, del_ind,\n        run_id, update_run_id, job_id, update_job_id\n\
    \    )\n    VALUES (\n        date '${LDTK_DATE}', src.loc_wid, src.item_wid,\
    \ 1, -- Set last year's stock flag to 1.\n        date '${WEEK_END_DT}', -- End\
    \ of the current business week.\n        date '${LY_CALENDAR_DT}', -- Corresponding\
    \ date from the previous year.\n        td_saturday(td_sunday(date '${WEEK_END_DT}')+1),\
    \ -- End of the business week from the previous year.\n        date '${WEEK_END_DT}'\
    \ - 7, -- Corresponding date from the previous week.\n        date '${EFF_FROM_DT}',\
    \ -- Effective start date for the record.\n        DATE '3500-12-31', -- High-date\
    \ indicating the record is currently active.\n        0, -- Deletion indicator;\
    \ 0 means active.\n        ${RUNID}, NULL,\n        '${JOB}', NULL\n    );\n.IF\
    \ ERRORCODE <> 0 THEN .QUIT 101;\n-- Commit the transaction to make all changes\
    \ permanent.\nEND TRANSACTION;\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n        ly_business_date,\n\
    \        ly_wk_business_date,\n        lw_business_date,\n        eff_from_dt,\n\
    \        eff_to_dt,\n        del_ind,\n        run_id,\n        update_run_id,\n\
    \        job_id,\n        update_job_id\n    )\n    VALUES (\n        date '${LDTK_DATE}',\n\
    \       src.loc_wid,\n        src.item_wid,\n        1, -- Set the stock indicator\
    \ to '1' for the new record.\n        date '${WEEK_END_DT}', -- Teradata function\
    \ to get the date of the Saturday of the week.\n        date '${LY_CALENDAR_DT}',\
    \ -- Calculate the date for the same day last year (approximated).\n        td_saturday(td_sunday(date\
    \ '${WEEK_END_DT}')+1), -- Last years end of business week\n        date '${EFF_FROM_DT}',\
    \ -- The effective start date for this record.\n        date '${WEEK_END_DT}'\
    \ - 7, -- Last weeks equivalent business date\n        DATE '3500-12-31', -- A\
    \ high-date to indicate the record is currently active.\n        0, -- Deletion\
    \ indicator; 0 means the record is active.\n        ${RUNID}, -- Placeholder for\
    \ the initial run ID.\n        NULL, -- update_run_id is NULL for new records.\n\
    \        '${JOB}', -- The name of the job that created this record.\n        NULL\
    \ -- update_job_id is NULL for new records.\n    );\n-- BTEQ command to check\
    \ for errors after the MERGE statement. If an error occurred,\n-- the script will\
    \ exit with a status code of 101.\n.IF ERRORCODE <> 0 THEN .QUIT 101;\n-- Step\
    \ 5: End the transaction. If all previous steps were successful, the changes\n\
    -- are committed to the database, making them permanent.\nEND TRANSACTION;\n.IF\
    \ ERRORCODE <> 0 THEN .QUIT 101;"
