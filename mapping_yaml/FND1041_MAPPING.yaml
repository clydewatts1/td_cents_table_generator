- description: Map source to trans table see mapping
  file_name: FND1041.190.TRANS.sql
  file_present: true
  job_name: FND1041
  notes: See mapping
  post_sql: ''
  pre_sql: ''
  reverse_sequence_no: 2
  sequence_no: 2
  source_database: See mapping
  source_table: ''
  sql_statement: "-- This query calculates the correct version number for different\
    \ levels of the product hierarchy (company, division, department, class, subclass\
    \ group, subclass).\n-- It identifies changes in style assignments within these\
    \ hierarchy levels to determine when a new version is needed.\n-- The core logic\
    \ compares two sets of data:\n--  Set A: The historical or previously existing\
    \ style assignments for each hierarchy level.\n--  Set B: The current style assignments\
    \ based on the latest data.\n--\n-- By analyzing the differences between these\
    \ sets, the query can flag when a version number needs to be incremented.\n--\n\
    --                           +-------------------------------------------------------------+\n\
    --                           |        The Union of A and B (A U B)           \
    \              |\n--                           | (All styles involved with a specific\
    \ hierarchy level)       |\n--                           |                   \
    \                                          |\n--                           | \
    \     Set A (Historical)        Set B (Current)              |\n--           \
    \                |   +---------------------+   +---------------------+       \
    \  |\n--                           |   | Styles previously   |   | Styles currentlyhr\
    \    |         |\n--                           |   | in this hierarchy   |   |\
    \ in this hierarchy   |         |\n--                           |   |        \
    \             +---+                     |         |\n--                      \
    \     |   | (Represents styles  | S | (Represents styles |         |\n--     \
    \                      |   | that might have     | t | that might have     | \
    \        |\n--                           |   | been moved out)     | y | been\
    \ moved in)      |         |\n--                           |   |             \
    \        | l |                     |         |\n--                           |\
    \   +---------------------+ e +---------------------+         |\n--          \
    \                 |                         | s |                            \
    \   |\n--                           |                         |   |          \
    \                     |\n--                           |                      \
    \   | i |                               |\n--                           |    \
    \                     | n |                               |\n--              \
    \             |                         |   |                               |\n\
    --                           |                         | b |                 \
    \              |\n--                           |                         | o |\
    \                               |\n--                           |            \
    \             | t |                               |\n--                      \
    \     |                         | h |                               |\n--    \
    \                       |                         |   |                      \
    \         |\n--                           |                         |(Same/Unchanged\
    \ Styles)|           |\n--                           |                       \
    \  +-----------------------+           |\n--                           |     \
    \                                                        |\n--               \
    \            +-------------------------------------------------------------+\n\
    WITH\nmhr AS (\n    -- CTE 1: mhr (Merchant Hierarchy)\n    -- This CTE builds\
    \ the foundational merchant hierarchy by joining various dimension tables.\n \
    \   -- It gathers information from company (co), division (dvn), department (dpt),\
    \ class (cls), and subclass (scls).\n    -- The result is a flattened view of\
    \ the hierarchy.\n    SELECT\n        scls.item_sbclas_wid,\n        TO_NUMBER(co.pmk_co_cd)\
    \ (SMALLINT) AS pmk_co_cd ,\n        co.pmk_co_wid,\n        co.pmk_co_name,\n\
    \        TO_NUMBER(dvn.dvisn_cd) (SMALLINT) AS dvisn_cd,\n        dvn.dvisn_wid,\n\
    \        dvn.dvisn_name,\n        TO_NUMBER(dpt.dept_cd) (SMALLINT) AS dept_cd,\n\
    \        dpt.dept_wid,\n        dpt.dept_name,\n        TO_NUMBER(cls.item_clas_cd)\
    \ (SMALLINT) AS item_clas_cd,\n        cls.item_clas_wid,\n        cls.item_clas_name,\n\
    \        TO_NUMBER(scls.pmk_item_sbclas_grp_cd) (SMALLINT) AS pmk_item_sbclas_grp_cd,\n\
    \        scls.pmk_item_sbclas_grp_name,\n        TO_NUMBER(scls.item_sbclas_cd)\
    \ (SMALLINT) AS item_sbclas_cd,\n        scls.item_sbclas_name,\n        byr.pmk_tctcl_buyr_cd\
    \ AS buyer_cd,\n        byr.pmk_tctcl_buyr_name AS buyer_name\n    FROM dwp01a_idw.item_sbclas\
    \ AS scls\n    INNER JOIN dwp01a_idw.item_clas AS cls\n        ON cls.item_clas_wid\
    \ = scls.item_clas_wid\n    INNER JOIN dwp01a_idw.dept AS dpt\n        ON dpt.dept_wid\
    \ = cls.dept_wid\n    INNER JOIN dwp01a_idw.dvisn AS dvn\n        ON dvn.dvisn_wid\
    \ = dpt.dvisn_wid\n    INNER JOIN dwp01a_idw.pmk_co AS co\n        ON co.pmk_co_wid\
    \ = dvn.pmk_co_wid\n    LEFT OUTER JOIN dwp01a_idw.pmk_tctcl_buyr AS byr\n   \
    \     ON dpt.pmk_tctcl_buyr_wid = byr.pmk_tctcl_buyr_wid AND byr.cur_flg = 'Y'\n\
    \    WHERE\n        scls.cur_flg = 'Y'\n        AND co.cur_flg = 'Y'\n       \
    \ AND dpt.cur_flg = 'Y'\n        AND cls.cur_flg = 'Y'\n        AND dvn.cur_flg\
    \ = 'Y'\n),\nmhrs AS (\n    -- CTE 2: mhrs (Merchant Hierarchy with Styles)\n\
    \    -- This CTE adds style information (styl_wid) to the merchant hierarchy created\
    \ in mhr.\n    -- It links styles to their respective subclasses.\n    SELECT\n\
    \        stl.styl_wid,\n        mhr.*\n    FROM mhr\n    INNER JOIN (SELECT styl_wid,item_sbclas_wid,eff_from_dt,eff_to_dt\
    \ FROM DWT04A_ACC_FND.DW_FND_STYL_SBCLASS_XREF WHERE eff_to_dt >  eff_from_dt)\
    \  AS stl\n        ON mhr.item_sbclas_wid = stl.item_sbclas_wid \n        WHERE\
    \   -- get the \"current rows based load token date \n                -- this\
    \ allows catchups\n            PERIOD(stl.eff_from_dt, stl.eff_to_dt) CONTAINS\
    \ (CURRENT_DATE - 1)\n),\nmhr_prev AS (\n    SELECT\n        mrd.merch_hiery_wid\
    \ AS item_sbclas_wid,\n        mrd.company_cd AS pmk_co_cd,\n        mrd.company_version_num\
    \ AS pmk_co_vers_num,\n        mrd.division_cd AS dvisn_cd,\n        mrd.division_version_num\
    \ AS dvisn_vers_num,\n        mrd.department_cd AS dept_cd,\n        mrd.department_version_num\
    \ AS dept_vers_num,\n        mrd.class_cd AS item_clas_cd,\n        mrd.class_version_num\
    \ AS item_clas_vers_num,\n        mrd.subclass_group_cd AS pmk_item_sbclas_grp_cd,\n\
    \        mrd.subclass_group_version_num AS pmk_item_sbclas_grp_vers_num,\n   \
    \     mrd.subclass_cd AS item_sbclas_cd,\n        mrd.subclass_version_num AS\
    \ item_sbclas_vers_num,\n        mrd.company_name,\n        mrd.division_name,\n\
    \        mrd.department_name,\n        mrd.class_name,\n        mrd.subclass_group_name,\n\
    \        mrd.subclass_name,\n        mrd.buyer_cd,\n        mrd.buyer_name,\n\
    \        mrd.pmk_co_wid,\n        mrd.dvisn_wid,\n        mrd.dept_wid,\n    \
    \    mrd.item_clas_wid,\n        mrd.merch_hiery_wid,\n        mrd.eff_to_dt\n\
    \    FROM dwt04a_acc_fnd.dw_fnd_merc_hierarchy_hist_dim AS mrd\n    WHERE mrd.eff_to_dt\
    \ = DATE '3500-12-31'\n),\nmhrs_prev AS (\n    SELECT\n        stl.styl_wid,\n\
    \        mrd.merch_hiery_wid,\n        mrd.company_cd AS pmk_co_cd,\n        mrd.company_version_num\
    \ AS pmk_co_vers_num,\n        mrd.division_cd AS dvisn_cd,\n        mrd.division_version_num\
    \ AS dvisn_vers_num,\n        mrd.department_cd AS dept_cd,\n        mrd.department_version_num\
    \ AS dept_vers_num,\n        mrd.class_cd AS item_clas_cd,\n        mrd.class_version_num\
    \ AS item_clas_vers_num,\n        mrd.subclass_group_cd AS pmk_item_sbclas_grp_cd,\n\
    \        mrd.subclass_group_version_num AS pmk_item_sbclas_grp_vers_num,\n   \
    \     mrd.subclass_cd AS item_sbclas_cd,\n        mrd.subclass_version_num AS\
    \ item_sbclas_vers_num,\n        mrd.company_name,\n        mrd.division_name,\n\
    \        mrd.department_name,\n        mrd.class_name,\n        mrd.subclass_group_name,\n\
    \        mrd.subclass_name,\n        mrd.buyer_cd,\n        mrd.buyer_name,\n\
    \        mrd.pmk_co_wid,\n        mrd.dvisn_wid,\n        mrd.dept_wid,\n    \
    \    mrd.item_clas_wid,\n        mrd.merch_hiery_wid AS item_sbclas_wid,\n   \
    \     mrd.eff_to_dt\n    FROM dwt04a_acc_fnd.dw_fnd_merc_hierarchy_hist_dim AS\
    \ mrd\n    INNER JOIN (SELECT styl_wid,item_sbclas_wid,eff_from_dt,eff_to_dt FROM\
    \ DWT04A_ACC_FND.DW_FND_STYL_SBCLASS_XREF WHERE eff_to_dt >  eff_from_dt)  AS\
    \ stl\n        ON mrd.merch_hiery_wid = stl.item_sbclas_wid \n        WHERE  \
    \ -- get the previous run position\n                 -- this allows catchups\n\
    \            PERIOD(stl.eff_from_dt, stl.eff_to_dt) CONTAINS (CURRENT_DATE - 1\
    \ - 1)\n),\n-- CTEs 3-8: maxv (Maximum Version) Series\n-- These CTEs find the\
    \ latest version number for each level of the hierarchy.\n-- This gives us the\
    \ starting point for versioning. If no version exists, it defaults to 1.\npmk_co_maxv\
    \ AS (\n    SELECT\n        bse.pmk_co_wid,\n        COALESCE(crt.pmk_co_vers_num,\
    \ 1) AS pmk_co_vers_num\n    FROM (SELECT DISTINCT pmk_co_wid FROM dwp01a_idw.pmk_co\
    \ WHERE cur_flg = 'Y') AS bse\n    LEFT OUTER JOIN (\n        SELECT\n       \
    \     pmk_co_wid,\n            MAX(pmk_co_vers_num) AS pmk_co_vers_num\n     \
    \   FROM mhrs_prev\n        WHERE eff_to_dt = DATE '3500-12-31'\n        GROUP\
    \ BY 1\n    ) AS crt\n        ON bse.pmk_co_wid = crt.pmk_co_wid\n),\ndvisn_maxv\
    \ AS (\n    SELECT\n        bse.dvisn_wid,\n        COALESCE(crt.dvisn_vers_num,\
    \ 1) AS dvisn_vers_num\n    FROM (SELECT DISTINCT dvisn_wid FROM dwp01a_idw.dvisn\
    \ WHERE cur_flg = 'Y') AS bse\n    LEFT OUTER JOIN (\n        SELECT\n       \
    \     dvisn_wid,\n            MAX(dvisn_vers_num) AS dvisn_vers_num\n        FROM\
    \ mhrs_prev\n        WHERE eff_to_dt = DATE '3500-12-31'\n        GROUP BY 1\n\
    \    ) AS crt\n        ON bse.dvisn_wid = crt.dvisn_wid\n),\ndept_maxv AS (\n\
    \    SELECT\n        bse.dept_wid,\n        COALESCE(crt.dept_vers_num, 1) AS\
    \ dept_vers_num\n    FROM (SELECT DISTINCT dept_wid FROM dwp01a_idw.dept WHERE\
    \ cur_flg = 'Y') AS bse\n    LEFT OUTER JOIN (\n        SELECT\n            dept_wid,\n\
    \            MAX(dept_vers_num) AS dept_vers_num\n        FROM mhrs_prev\n   \
    \     WHERE eff_to_dt = DATE '3500-12-31'\n        GROUP BY 1\n    ) AS crt\n\
    \        ON bse.dept_wid = crt.dept_wid\n),\nitem_clas_maxv AS (\n    SELECT\n\
    \        bse.item_clas_wid,\n        COALESCE(crt.item_clas_vers_num, 1) AS item_clas_vers_num\n\
    \    FROM (SELECT DISTINCT item_clas_wid FROM dwp01a_idw.item_clas WHERE cur_flg\
    \ = 'Y') AS bse\n    LEFT OUTER JOIN (\n        SELECT\n            item_clas_wid,\n\
    \            MAX(item_clas_vers_num) AS item_clas_vers_num\n        FROM mhrs_prev\n\
    \        WHERE eff_to_dt = DATE '3500-12-31'\n        GROUP BY 1\n    ) AS crt\n\
    \        ON bse.item_clas_wid = crt.item_clas_wid\n),\npmk_item_sbclas_grp_maxv\
    \ AS (\n    SELECT\n        bse.pmk_item_sbclas_grp_cd,\n        COALESCE(crt.pmk_item_sbclas_grp_vers_num,\
    \ 1) AS pmk_item_sbclas_grp_vers_num\n    FROM (SELECT DISTINCT pmk_item_sbclas_grp_cd\
    \ FROM dwp01a_idw.item_sbclas WHERE cur_flg = 'Y') AS bse\n    LEFT OUTER JOIN\
    \ (\n        SELECT\n            pmk_item_sbclas_grp_cd,\n            MAX(pmk_item_sbclas_grp_vers_num)\
    \ AS pmk_item_sbclas_grp_vers_num\n        FROM mhrs_prev\n        WHERE eff_to_dt\
    \ = DATE '3500-12-31'\n        GROUP BY 1\n    ) AS crt\n        ON bse.pmk_item_sbclas_grp_cd\
    \ = crt.pmk_item_sbclas_grp_cd\n),\nitem_sbclas_maxv AS (\n    SELECT\n      \
    \  bse.item_sbclas_wid,\n        COALESCE(crt.item_sbclas_vers_num, 1) AS item_sbclas_vers_num\n\
    \    FROM (SELECT DISTINCT item_sbclas_wid FROM dwp01a_idw.item_sbclas WHERE cur_flg\
    \ = 'Y') AS bse\n    LEFT OUTER JOIN (\n        SELECT\n            item_sbclas_wid,\n\
    \            MAX(item_sbclas_vers_num) AS item_sbclas_vers_num\n        FROM mhrs_prev\n\
    \        WHERE eff_to_dt = DATE '3500-12-31'\n        GROUP BY 1\n    ) AS crt\n\
    \        ON bse.item_sbclas_wid = crt.item_sbclas_wid\n),\n-- CTEs for Set A (Historical\
    \ Data)\n-- These CTEs define \"Set A\" by selecting the current, active records\
    \ from the version cross-reference table.\n-- This represents the \"before\" state\
    \ of style assignments.\npmk_co_a AS (\n    SELECT\n        pmk_co_wid,\n    \
    \    styl_wid,\n        pmk_co_vers_num\n    FROM mhrs_prev\n),\ndvisn_a AS (\n\
    \    SELECT\n        dvisn_wid,\n        styl_wid,\n        dvisn_vers_num\n \
    \   FROM mhrs_prev\n),\ndept_a AS (\n    SELECT\n        dept_wid,\n        styl_wid,\n\
    \        dvisn_vers_num\n    FROM mhrs_prev\n),\nitem_clas_a AS (\n    SELECT\n\
    \        item_clas_wid,\n        styl_wid,\n        item_clas_vers_num\n    FROM\
    \ mhrs_prev\n),\npmk_item_sbclas_grp_a AS (\n    SELECT\n        pmk_item_sbclas_grp_cd,\n\
    \        styl_wid,\n        pmk_item_sbclas_grp_vers_num\n    FROM mhrs_prev\n\
    ),\nitem_sbclas_a AS (\n    SELECT\n        item_sbclas_wid,\n        styl_wid,\n\
    \        item_sbclas_vers_num\n    FROM mhrs_prev\n),\n-- CTEs for Set B (Current\
    \ Data)\n-- These CTEs define \"Set B\" by selecting from the mhrs CTE.\n-- This\
    \ represents the \"after\" or current state of style assignments.\npmk_co_b AS\
    \ (\n    SELECT pmk_co_wid, styl_wid FROM mhrs\n),\ndvisn_b AS (\n    SELECT dvisn_wid,\
    \ styl_wid FROM mhrs\n),\ndept_b AS (\n    SELECT dept_wid, styl_wid FROM mhrs\n\
    ),\nitem_clas_b AS (\n    SELECT item_clas_wid, styl_wid FROM mhrs\n),\npmk_item_sbclas_grp_b\
    \ AS (\n    SELECT pmk_item_sbclas_grp_cd, styl_wid FROM mhrs\n),\nitem_sbclas_b\
    \ AS (\n    SELECT item_sbclas_wid, styl_wid FROM mhrs\n),\n-- CTEs for AB Merge\n\
    -- These CTEs perform a FULL OUTER JOIN on Set A and Set B for each hierarchy\
    \ level.\n-- This allows us to see which styles are in A only (removed), in B\
    \ only (added), or in both (unchanged).\npmk_co_ab AS (\n    SELECT\n        COALESCE(a.styl_wid,\
    \ b.styl_wid) AS styl_wid,\n        COALESCE(a.pmk_co_wid, b.pmk_co_wid) AS pmk_co_wid,\n\
    \        CASE\n            WHEN a.styl_wid = b.styl_wid THEN 'AB' -- In both A\
    \ and B (unchanged)\n            WHEN a.styl_wid IS NOT NULL AND b.styl_wid IS\
    \ NULL THEN 'A' -- In A only (removed)\n            WHEN b.styl_wid IS NOT NULL\
    \ AND a.styl_wid IS NULL THEN 'B' -- In B only (added)\n        END AS set_status,\n\
    \        MAX(a.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid, b.styl_wid))\
    \ AS a_styl_wid,\n        MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS b_styl_wid,\n        CASE WHEN a_styl_wid = b_styl_wid THEN\
    \ 1 ELSE 0 END AS common_aub\n    FROM pmk_co_a AS a\n    FULL OUTER JOIN pmk_co_b\
    \ AS b\n        ON a.pmk_co_wid = b.pmk_co_wid AND a.styl_wid = b.styl_wid\n),\n\
    dvisn_ab AS (\n    SELECT\n        COALESCE(a.styl_wid, b.styl_wid) AS styl_wid,\n\
    \        COALESCE(a.dvisn_wid, b.dvisn_wid) AS dvisn_wid,\n        CASE\n    \
    \        WHEN a.styl_wid = b.styl_wid THEN 'AB'\n            WHEN a.styl_wid IS\
    \ NOT NULL AND b.styl_wid IS NULL THEN 'A'\n            WHEN b.styl_wid IS NOT\
    \ NULL AND a.styl_wid IS NULL THEN 'B'\n        END AS set_status,\n        MAX(a.styl_wid)\
    \ OVER (PARTITION BY COALESCE(a.styl_wid, b.styl_wid)) AS a_styl_wid,\n      \
    \  MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid, b.styl_wid)) AS b_styl_wid,\n\
    \        CASE WHEN a_styl_wid = b_styl_wid THEN 1 ELSE 0 END AS common_aub\n \
    \   FROM dvisn_a AS a\n    FULL OUTER JOIN dvisn_b AS b\n        ON a.dvisn_wid\
    \ = b.dvisn_wid AND a.styl_wid = b.styl_wid\n),\ndept_ab AS (\n    SELECT\n  \
    \      COALESCE(a.styl_wid, b.styl_wid) AS styl_wid,\n        COALESCE(a.dept_wid,\
    \ b.dept_wid) AS dept_wid,\n        CASE\n            WHEN a.styl_wid = b.styl_wid\
    \ THEN 'AB'\n            WHEN a.styl_wid IS NOT NULL AND b.styl_wid IS NULL THEN\
    \ 'A'\n            WHEN b.styl_wid IS NOT NULL AND a.styl_wid IS NULL THEN 'B'\n\
    \        END AS set_status,\n        MAX(a.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS a_styl_wid,\n        MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS b_styl_wid,\n        CASE WHEN a_styl_wid = b_styl_wid THEN\
    \ 1 ELSE 0 END AS common_aub\n    FROM dept_a AS a\n    FULL OUTER JOIN dept_b\
    \ AS b\n        ON a.dept_wid = b.dept_wid AND a.styl_wid = b.styl_wid\n),\nitem_clas_ab\
    \ AS (\n    SELECT\n        COALESCE(a.styl_wid, b.styl_wid) AS styl_wid,\n  \
    \      COALESCE(a.item_clas_wid, b.item_clas_wid) AS item_clas_wid,\n        CASE\n\
    \            WHEN a.styl_wid = b.styl_wid THEN 'AB'\n            WHEN a.styl_wid\
    \ IS NOT NULL AND b.styl_wid IS NULL THEN 'A'\n            WHEN b.styl_wid IS\
    \ NOT NULL AND a.styl_wid IS NULL THEN 'B'\n        END AS set_status,\n     \
    \   MAX(a.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid, b.styl_wid)) AS a_styl_wid,\n\
    \        MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid, b.styl_wid))\
    \ AS b_styl_wid,\n        CASE WHEN a_styl_wid = b_styl_wid THEN 1 ELSE 0 END\
    \ AS common_aub\n    FROM item_clas_a AS a\n    FULL OUTER JOIN item_clas_b AS\
    \ b\n        ON a.item_clas_wid = b.item_clas_wid AND a.styl_wid = b.styl_wid\n\
    ),\npmk_item_sbclas_grp_ab AS (\n    SELECT\n        COALESCE(a.styl_wid, b.styl_wid)\
    \ AS styl_wid,\n        COALESCE(a.pmk_item_sbclas_grp_cd, b.pmk_item_sbclas_grp_cd)\
    \ AS pmk_item_sbclas_grp_cd,\n        CASE\n            WHEN a.styl_wid = b.styl_wid\
    \ THEN 'AB'\n            WHEN a.styl_wid IS NOT NULL AND b.styl_wid IS NULL THEN\
    \ 'A'\n            WHEN b.styl_wid IS NOT NULL AND a.styl_wid IS NULL THEN 'B'\n\
    \        END AS set_status,\n        MAX(a.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS a_styl_wid,\n        MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS b_styl_wid,\n        CASE WHEN a_styl_wid = b_styl_wid THEN\
    \ 1 ELSE 0 END AS common_aub\n    FROM pmk_item_sbclas_grp_a AS a\n    FULL OUTER\
    \ JOIN pmk_item_sbclas_grp_b AS b\n        ON a.pmk_item_sbclas_grp_cd = b.pmk_item_sbclas_grp_cd\
    \ AND a.styl_wid = b.styl_wid\n),\nitem_sbclas_ab AS (\n    SELECT\n        COALESCE(a.styl_wid,\
    \ b.styl_wid) AS styl_wid,\n        COALESCE(a.item_sbclas_wid, b.item_sbclas_wid)\
    \ AS item_sbclas_wid,\n        CASE\n            WHEN a.styl_wid = b.styl_wid\
    \ THEN 'AB'\n            WHEN a.styl_wid IS NOT NULL AND b.styl_wid IS NULL THEN\
    \ 'A'\n            WHEN b.styl_wid IS NOT NULL AND a.styl_wid IS NULL THEN 'B'\n\
    \        END AS set_status,\n        MAX(a.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS a_styl_wid,\n        MAX(b.styl_wid) OVER (PARTITION BY COALESCE(a.styl_wid,\
    \ b.styl_wid)) AS b_styl_wid,\n        CASE WHEN a_styl_wid = b_styl_wid THEN\
    \ 1 ELSE 0 END AS common_aub\n    FROM item_sbclas_a AS a\n    FULL OUTER JOIN\
    \ item_sbclas_b AS b\n        ON a.item_sbclas_wid = b.item_sbclas_wid AND a.styl_wid\
    \ = b.styl_wid\n),\n-- CTEs for Cardinality Calculation\n-- These CTEs calculate\
    \ the counts of added, removed, and unchanged styles.\n-- The 'version_inc' flag\
    \ is set to 1 if there are any changes.\npmk_co_ab_card AS (\n    SELECT\n   \
    \     pmk_co_wid,\n        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status\
    \ = 'A' THEN 1 ELSE 0 END), 0) AS card_amb, -- A minus B\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\
    \ -- B minus A\n        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status\
    \ = 'AB' THEN 1 ELSE 0 END), 0) AS card_anb, -- A intersect B\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'A' THEN 1 ELSE 0 END), 0) AS card_unamb,\
    \ -- not common A minus B\n        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND\
    \ ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma, -- not common B minus\
    \ A\n        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'AB'\
    \ THEN 1 ELSE 0 END), 0) AS card_unanb, -- not common A intersect B\n        CASE\
    \ WHEN card_amb > 0 OR card_bma > 0 THEN 1 ELSE 0 END AS version_inc\n    FROM\
    \ pmk_co_ab AS ab\n    GROUP BY 1\n),\ndvisn_ab_card AS (\n    SELECT\n      \
    \  dvisn_wid,\n        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status\
    \ = 'A' THEN 1 ELSE 0 END), 0) AS card_amb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_anb,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'A' THEN\
    \ 1 ELSE 0 END), 0) AS card_unamb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 0 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_unanb,\n\
    \        CASE WHEN card_amb > 0 OR card_bma > 0 THEN 1 ELSE 0 END AS version_inc\n\
    \    FROM dvisn_ab AS ab\n    GROUP BY 1\n),\ndept_ab_card AS (\n    SELECT\n\
    \        dept_wid,\n        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status\
    \ = 'A' THEN 1 ELSE 0 END), 0) AS card_amb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_anb,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'A' THEN\
    \ 1 ELSE 0 END), 0) AS card_unamb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 0 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_unanb,\n\
    \        CASE WHEN card_amb > 0 OR card_bma > 0 THEN 1 ELSE 0 END AS version_inc\n\
    \    FROM dept_ab AS ab\n    GROUP BY 1\n),\nitem_clas_ab_card AS (\n    SELECT\n\
    \        item_clas_wid,\n        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND\
    \ ab.set_status = 'A' THEN 1 ELSE 0 END), 0) AS card_amb,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status = 'AB' THEN\
    \ 1 ELSE 0 END), 0) AS card_anb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 0 AND ab.set_status = 'A' THEN 1 ELSE 0 END), 0) AS card_unamb,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'AB' THEN\
    \ 1 ELSE 0 END), 0) AS card_unanb,\n        CASE WHEN card_amb > 0 OR card_bma\
    \ > 0 THEN 1 ELSE 0 END AS version_inc\n    FROM item_clas_ab AS ab\n    GROUP\
    \ BY 1\n),\npmk_item_sbclas_grp_ab_card AS (\n    SELECT\n        pmk_item_sbclas_grp_cd,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status = 'A' THEN\
    \ 1 ELSE 0 END), 0) AS card_amb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_anb,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'A' THEN\
    \ 1 ELSE 0 END), 0) AS card_unamb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 0 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'AB' THEN 1 ELSE 0 END), 0) AS card_unanb,\n\
    \        CASE WHEN card_amb > 0 OR card_bma > 0 THEN 1 ELSE 0 END AS version_inc\n\
    \    FROM pmk_item_sbclas_grp_ab AS ab\n    GROUP BY 1\n),\nitem_sbclas_ab_card\
    \ AS (\n    SELECT\n        item_sbclas_wid,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 1 AND ab.set_status = 'A' THEN 1 ELSE 0 END), 0) AS card_amb,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 1 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_bma,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 1 AND ab.set_status = 'AB' THEN\
    \ 1 ELSE 0 END), 0) AS card_anb,\n        COALESCE(SUM(CASE WHEN ab.common_aub\
    \ = 0 AND ab.set_status = 'A' THEN 1 ELSE 0 END), 0) AS card_unamb,\n        COALESCE(SUM(CASE\
    \ WHEN ab.common_aub = 0 AND ab.set_status = 'B' THEN 1 ELSE 0 END), 0) AS card_unbma,\n\
    \        COALESCE(SUM(CASE WHEN ab.common_aub = 0 AND ab.set_status = 'AB' THEN\
    \ 1 ELSE 0 END), 0) AS card_unanb,\n        CASE WHEN card_amb > 0 OR card_bma\
    \ > 0 THEN 1 ELSE 0 END AS version_inc\n    FROM item_sbclas_ab AS ab\n    GROUP\
    \ BY 1\n),\n-- CTEs for Version Calculation\n-- These CTEs determine the new version\
    \ number by adding the 'version_inc' flag to the max version.\npmk_co_version\
    \ AS (\n    SELECT\n        maxv.pmk_co_wid,\n        NVL2(ab_card.version_inc,\
    \ COALESCE(maxv.pmk_co_vers_num, 1) + ab_card.version_inc, 0) AS new_pmk_co_vers_num,\n\
    \        card_amb,\n        card_bma,\n        card_anb,\n        card_unamb,\n\
    \        card_unbma,\n        card_unanb\n    FROM pmk_co_maxv AS maxv\n    LEFT\
    \ OUTER JOIN pmk_co_ab_card AS ab_card\n        ON maxv.pmk_co_wid = ab_card.pmk_co_wid\n\
    ),\ndvisn_version AS (\n    SELECT\n        maxv.dvisn_wid,\n        NVL2(ab_card.version_inc,\
    \ COALESCE(maxv.dvisn_vers_num, 1) + ab_card.version_inc, 0) AS new_dvisn_vers_num,\n\
    \        card_amb,\n        card_bma,\n        card_anb,\n        card_unamb,\n\
    \        card_unbma,\n        card_unanb\n    FROM dvisn_maxv AS maxv\n    LEFT\
    \ OUTER JOIN dvisn_ab_card AS ab_card\n        ON maxv.dvisn_wid = ab_card.dvisn_wid\n\
    ),\ndept_version AS (\n    SELECT\n        maxv.dept_wid,\n        NVL2(ab_card.version_inc,\
    \ COALESCE(maxv.dept_vers_num, 1) + ab_card.version_inc, 0) AS new_dept_vers_num,\n\
    \        card_amb,\n        card_bma,\n        card_anb,\n        card_unamb,\n\
    \        card_unbma,\n        card_unanb\n    FROM dept_maxv AS maxv\n    LEFT\
    \ OUTER JOIN dept_ab_card AS ab_card\n        ON maxv.dept_wid = ab_card.dept_wid\n\
    ),\nitem_clas_version AS (\n    SELECT\n        maxv.item_clas_wid,\n        NVL2(ab_card.version_inc,\
    \ COALESCE(maxv.item_clas_vers_num, 1) + ab_card.version_inc, 0) AS new_item_clas_vers_num,\n\
    \        card_amb,\n        card_bma,\n        card_anb,\n        card_unamb,\n\
    \        card_unbma,\n        card_unanb\n    FROM item_clas_maxv AS maxv\n  \
    \  LEFT OUTER JOIN item_clas_ab_card AS ab_card\n        ON maxv.item_clas_wid\
    \ = ab_card.item_clas_wid\n),\npmk_item_sbclas_grp_version AS (\n    SELECT\n\
    \        maxv.pmk_item_sbclas_grp_cd,\n        NVL2(ab_card.version_inc, COALESCE(maxv.pmk_item_sbclas_grp_vers_num,\
    \ 1) + ab_card.version_inc, 0) AS new_pmk_item_sbclas_grp_vers_num,\n        card_amb,\n\
    \        card_bma,\n        card_anb,\n        card_unamb,\n        card_unbma,\n\
    \        card_unanb\n    FROM pmk_item_sbclas_grp_maxv AS maxv\n    LEFT OUTER\
    \ JOIN pmk_item_sbclas_grp_ab_card AS ab_card\n        ON maxv.pmk_item_sbclas_grp_cd\
    \ = ab_card.pmk_item_sbclas_grp_cd\n),\nitem_sbclas_version AS (\n    SELECT\n\
    \        maxv.item_sbclas_wid,\n        NVL2(ab_card.version_inc, COALESCE(maxv.item_sbclas_vers_num,\
    \ 1) + ab_card.version_inc, 0) AS new_item_sbclas_vers_num,\n        card_amb,\n\
    \        card_bma,\n        card_anb,\n        card_unamb,\n        card_unbma,\n\
    \        card_unanb\n    FROM item_sbclas_maxv AS maxv\n    LEFT OUTER JOIN item_sbclas_ab_card\
    \ AS ab_card\n        ON maxv.item_sbclas_wid = ab_card.item_sbclas_wid\n)\n--\
    \ Final SELECT Statement\n-- This joins the original merchant hierarchy (mhr)\
    \ with the calculated version numbers for each level.\n-- The result is the complete\
    \ hierarchy with the correct, newly calculated version numbers.\nSELECT\n    mhr.item_sbclas_wid\
    \ AS merch_hiery_wid,\n    mhr.pmk_co_cd AS company_cd,\n    mhr.pmk_co_wid,\n\
    \    mhr.pmk_co_name AS company_name,\n    pmk_co_version.new_pmk_co_vers_num\
    \ AS company_version_num,\n    CASE WHEN mhr_prev.pmk_co_vers_num = pmk_co_version.new_pmk_co_vers_num\
    \ THEN 0 ELSE 1 END AS pmk_co_vers_reclass_evnt_ind,\n    COALESCE(pmk_co_version.card_amb,\
    \ 0) AS pmk_co_stl_in_count,\n    COALESCE(pmk_co_version.card_bma, 0) AS pmk_co_stl_out_count,\n\
    \    COALESCE(pmk_co_version.card_anb, 0) AS pmk_co_stl_cmn_count,\n    COALESCE(pmk_co_version.card_unamb,\
    \ 0) AS pmk_co_stl_del_count,\n    COALESCE(pmk_co_version.card_unbma, 0) AS pmk_co_stl_new_count,\n\
    \    COALESCE(pmk_co_version.card_unanb, 0) AS pmk_co_stl_not_common_cmn_count,\n\
