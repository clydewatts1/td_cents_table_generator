sql_steps:
  FND2203.300.VALIDATE: "-- =============================================================================\n\
    -- Script Name: Duplicate Primary Key Check\n-- Description: This script checks\
    \ for duplicate records in the staging table\n--              'DW${INSTANCE}T_TMP_ACC_FND.FND_SLS_FCT_01_FCT_STG'\
    \ based on the\n--              composite primary key (business_date, location_id,\
    \ item_id).\n--              It will exit with an error code if duplicates are\
    \ found.\n-- =============================================================================\n\
    -- Use a Common Table Expression (CTE) to identify duplicate records.\nWITH TST\
    \ AS (\n    SELECT\n        business_date,\n        location_id,\n        item_id,\n\
    \        COUNT(*) AS dupl_count\n    FROM\n        DW${INSTANCE}T_TMP_ACC_FND.FND_SLS_FCT_01_FCT_STG\n\
    \    GROUP BY\n        -- Group by the columns that form the unique key to find\
    \ duplicates.\n        business_date,\n        location_id,\n        item_id\n\
    \    HAVING\n        -- Filter for groups with more than one record, which indicates\
    \ a duplicate.\n        dupl_count > 1\n)\n-- Select the top 10 duplicate records\
    \ to display as a sample.\nSELECT TOP 10\n    'Duplicate count check' AS Error_Desc,\n\
    \    TST.* -- Select all columns from the CTE\nFROM\n    TST\nORDER BY\n    --\
    \ Order by location_id to make the output consistent.\n    dupl_count DESC\n;\n\
    -- =============================================================================\n\
    -- BTEQ Control Logic (Teradata Specific)\n-- =============================================================================\n\
    -- Check the error code from the last SQL statement.\n-- If ERRORCODE is not 0,\
    \ it means the SELECT statement failed for some reason.\n.IF ERRORCODE <> 0 THEN\
    \ .QUIT 101\n-- Check the activity count from the last SQL statement.\n-- If ACTIVITYCOUNT\
    \ is not 0, it means our query found and returned duplicate rows.\n-- The script\
    \ then quits with a specific error code (102) to signal this failure.\n.IF ACTIVITYCOUNT\
    \ <> 0 THEN .QUIT 102"
  FND2203.310.VALIDATE: "-- =============================================================================\n\
    -- Script Name: Single Business Date Check\n-- Description: This script verifies\
    \ that the staging table\n--              'DW${INSTANCE}T_TMP_ACC_FND.FND_SLS_FCT_01_FCT_STG'\
    \ contains records\n--              for only one 'business_date'. The process\
    \ should fail if\n--              data for multiple dates is present.\n-- =============================================================================\n\
    -- Use a Common Table Expression (CTE) to count the number of distinct dates.\n\
    WITH TST AS (\n    SELECT\n        COUNT(DISTINCT business_date) AS business_date_count\n\
    \    FROM\n        DW${INSTANCE}T_TMP_ACC_FND.FND_SLS_FCT_01_FCT_STG\n    HAVING\n\
    \        -- This condition is the core of the test. The query will only\n    \
    \    -- return a row if there is more than one distinct business_date.\n     \
    \   business_date_count > 1\n)\n-- This SELECT statement will only run and return\
    \ a row if the CTE above\n-- found more than one business_date.\nSELECT\n    'Only\
    \ One Business Date check failed' AS Error_Desc,\n    TST.* -- Select all columns\
    \ from the CTE\nFROM\n    TST;\n-- =============================================================================\n\
    -- BTEQ Control Logic (Teradata Specific)\n-- =============================================================================\n\
    -- Check the error code from the last SQL statement.\n-- If ERRORCODE is not 0,\
    \ it means the SELECT statement failed for some reason.\n.IF ERRORCODE <> 0 THEN\
    \ .QUIT 101\n-- Check the activity count from the last SQL statement.\n-- If ACTIVITYCOUNT\
    \ is not 0, it means our query found multiple business dates\n-- and returned\
    \ a row. The script then quits with a specific error code to\n-- signal this data\
    \ quality failure.\n.IF ACTIVITYCOUNT <> 0 THEN .QUIT 103 -- Using 103 to differentiate\
    \ from previous check"
